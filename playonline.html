        crossorigin="anonymous"></script>

    <style>
        :root { 
            --verde-fondo: #1a3c2a;
            --verde-mesa: #1e4430;
            --verde-oscuro: #0f2b1a;
            --verde-claro: #2d5a3f;
            --dorado: #c8a84e;
            --dorado-claro: #d4b356;
            --blanco: #f5f5f0;
            --negro: #111;
            --rojo: #c0392b;
            --rojo-oscuro: #962d22;
            --azul: #2980b9;
            --gris-oscuro: #1a1a1a;
            --gris-medio: #333;
            --gris-claro: #888;
            --borde-carta: #1a1a1a;
            --sombra-carta: 0 8px 24px rgba(0, 0, 0, 0.5);
            --sombra-suave: 0 4px 16px rgba(0, 0, 0, 0.35);
            --transicion: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transicion-rapida: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --borde-redondo: 14px;
            --borde-redondo-carta: 10px;
            --carta-mesa: clamp(238.29px, 52.728vmin, 461.37px);
            --carta-mesa-max-h: clamp(330.05px, 72.501vmin, 645.918px);
            --carta-mano: clamp(223.08px, 46.137vmin, 412.088px);
            --carta-mano-max-h: clamp(313.073px, 66.0vmin, 576.713px);
            --carta-cpu: clamp(105.456px, 22.308vmin, 186.576px);
            --carta-cpu-max-h: clamp(146.016px, 30.34vmin, 263.64px);
            --mano-altura: clamp(279.15px, 45.63vmin, 443.625px);
            --btn-font: clamp(15px, 3.6vmin, 22px);
            --btn-pad-y: clamp(10px, 2.2vmin, 18px);
            --btn-pad-x: clamp(12px, 3vmin, 28px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--verde-fondo);
            color: var(--blanco);
            height: 100vh; height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .juego {
            display: grid;
            height: 100dvh; max-height: 100dvh;
            width: 100vw; max-width: 100vw;
            overflow: hidden;
            position: relative;
            gap: clamp(3px, 0.8vh, 10px);
            padding: clamp(4px, 1vh, 10px);
            grid-template-rows: auto minmax(0, 1fr) auto auto auto;
            grid-template-columns: 1fr;
            grid-template-areas: "cpu" "mesa" "botones" "jugador" "marcador";
        }

        .zona-cpu { grid-area: cpu; }
        .zona-mesa { grid-area: mesa; }
        .zona-botones { grid-area: botones; }
        .zona-jugador { grid-area: jugador; }
        .panel-marcador { grid-area: marcador; }

        .zona-cpu {
            display: flex; flex-direction: column; align-items: center;
            gap: clamp(2px, 0.5vh, 6px);
            padding: 0 4px 0; flex-shrink: 0;
        }

        .etiqueta-turno {
            font-size: clamp(13px, 2.8vmin, 17px);
            font-weight: 700; letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            transition: color 0.3s, transform 0.3s;
        }

        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

        .etiqueta-turno.activo { color: var(--dorado); animation: latido 0.9s ease-in-out infinite; }

        .mano-cpu {
            display: flex; gap: clamp(4px, 1vmin, 8px);
            justify-content: center; flex-wrap: nowrap;
            margin-top: calc(-1 * clamp(4px, 1vh, 10px));
            overflow: hidden;
            height: calc(var(--carta-cpu-max-h) * 0.6);
            align-items: flex-end;
        }

        .zona-mesa {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; min-height: 0;
            background: radial-gradient(ellipse at center, rgba(30, 68, 48, 0.7) 0%, transparent 70%);
            border-radius: var(--borde-redondo);
            margin: 0 2px; overflow: visible;
        }

        .indicador-canto {
            font-size: clamp(14px, 3.2vmin, 19px);
            font-weight: 800; letter-spacing: 0.06em;
            color: var(--dorado); text-align: center;
            min-height: 0;
            padding: clamp(3px, 0.6vh, 5px) clamp(10px, 2.5vmin, 15px);
            flex-shrink: 0; border-radius: 20px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 8px;
            transition: opacity 0.3s; opacity: 0;
        }

        .indicador-canto.visible { opacity: 1; }

        .mesa-cartas {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            position: relative; min-height: 0;
            padding: 12px; overflow: visible;
        }

        .mesa-fila {
            display: flex; justify-content: center; align-items: center;
            position: relative; width: auto; min-height: 0;
        }

        .mesa-cartas .carta-contenedor {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: var(--transicion);
            display: flex; flex-direction: column; align-items: center;
            margin: 0;
        }

        .mesa-cartas .carta-contenedor.ganadora {
            z-index: 6;
            transform: translate(-50%, -50%) translateY(-10px) scale(1.02);
            filter: drop-shadow(0 10px 14px rgba(200,168,78,0.5));
        }

        .mesa-cartas .carta-contenedor.perdedora {
            z-index: 2;
            transform: translate(-50%, -50%) translateY(6px);
            opacity: 0.9;
        }

        /* Enfrentamiento de cartas: quien gana brilla, quien pierde se atenúa */
        .mesa-cartas .carta-contenedor.ganadora-ronda {
            z-index: 20 !important;
            filter: brightness(1.08) drop-shadow(0 0 10px rgba(200, 168, 78, 0.65));
        }

        .mesa-cartas .carta-contenedor.perdedora-ronda {
            opacity: 0.75;
            filter: saturate(0.7);
        }

        .mesa-cartas .carta-img {
            width: var(--carta-mano);
            height: auto;
            max-height: var(--carta-mano-max-h);
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4));
        }

        .zona-botones {
            display: flex; flex-direction: row;
            justify-content: center; align-items: center;
            gap: clamp(6px, 1.5vmin, 12px);
            padding: clamp(2px, 0.5vh, 6px) 4px;
            flex-shrink: 0;
        }

        .botones-laterales {
            display: flex; flex-direction: column;
            justify-content: center; align-items: stretch;
            gap: clamp(4px, 1vmin, 8px);
            padding: 0;
        }

        .btn-accion {
            padding: var(--btn-pad-y) var(--btn-pad-x);
            border-radius: 50px;
            font-size: var(--btn-font);
            font-weight: 800; letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transicion-rapida);
            background: var(--gris-medio);
            color: var(--blanco);
            white-space: nowrap;
            position: relative;
            min-width: clamp(90px, 20vmin, 140px);
            text-align: center;
        }

        .btn-accion:active:not(:disabled) { transform: scale(0.95); }
        .btn-accion:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.5); }

        .btn-penal { background: var(--rojo); border-color: var(--rojo-oscuro); }
        .btn-penal:not(:disabled):hover { background: #d44235; box-shadow: 0 4px 16px rgba(192, 57, 43, 0.4); }
        .btn-gol { background: var(--dorado); border-color: #a8883a; color: #1a2a10; }
        .btn-gol:not(:disabled):hover { background: var(--dorado-claro); box-shadow: 0 4px 16px rgba(200, 168, 78, 0.5); }
        .btn-golazo { background: #e67e22; border-color: #c0651f; color: #fff; }
        .btn-golazo:not(:disabled):hover { background: #f08c34; box-shadow: 0 4px 16px rgba(230, 126, 34, 0.5); }
        .btn-quiero { background: #27ae60; border-color: #1e8449; }
        .btn-quiero:not(:disabled):hover { background: #2ecc71; box-shadow: 0 4px 16px rgba(39, 174, 96, 0.4); }
        .btn-no-quiero { background: #7f8c8d; border-color: #6c7a7a; }
        .btn-no-quiero:not(:disabled):hover { background: #95a5a6; }
        .btn-var { background: #2980b9; border-color: #1f6da0; }
        .btn-var:not(:disabled):hover { background: #3498db; box-shadow: 0 4px 16px rgba(41, 128, 185, 0.4); }

        .zona-jugador {
            display: flex; flex-direction: column; align-items: center;
            gap: clamp(2px, 0.5vh, 6px);
            padding: 0 4px clamp(2px, 0.5vh, 6px);
            flex-shrink: 0;
        }

        .mano-jugador {
            display: flex; justify-content: center; align-items: flex-end;
            position: relative;
            height: var(--mano-altura);
            min-height: 0;
            width: min(100%, 920px);
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }

        .mano-jugador .carta-contenedor {
            position: absolute;
            transition: var(--transicion);
            cursor: pointer;
            transform-origin: bottom center;
        }

        .mano-jugador .carta-contenedor.seleccionada {
            transform: translateY(clamp(-10px, -2vh, -20px)) scale(1.06);
            z-index: 10 !important;
            filter: brightness(1.1);
        }

        .panel-marcador {
            background: var(--gris-oscuro);
            border-radius: var(--borde-redondo);
            padding: clamp(6px, 1.2vh, 10px) clamp(10px, 2.5vw, 16px);
            display: flex; align-items: center; justify-content: space-between;
            gap: clamp(6px, 1.5vw, 12px);
            margin: 0;
            box-shadow: var(--sombra-suave);
            cursor: pointer;
            transition: var(--transicion);
            flex-shrink: 0;
        }

        .botones-sonido { display: flex; gap: clamp(6px, 1vmin, 10px); flex-shrink: 0; }

        .btn-sonido {
            padding: clamp(6px, 1.2vh, 10px) clamp(10px, 2vw, 14px);
            border-radius: 50px;
            font-size: clamp(12px, 2.8vmin, 16px);
            font-weight: 700; cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transicion-rapida);
            background: var(--gris-medio);
            color: var(--blanco);
            white-space: nowrap;
            min-width: clamp(50px, 12vmin, 70px);
            text-align: center;
        }

        .btn-sonido:hover { background: #444; transform: scale(1.05); }
        .btn-sonido:active { transform: scale(0.95); }
        .btn-sonido.desactivado { opacity: 0.4; background: var(--gris-oscuro); border-color: var(--gris-medio); }
        .btn-sonido.activo { background: #27ae60; border-color: #1e8449; }

        .panel-marcador:hover { background: #222; }
        .panel-marcador:active { transform: scale(0.98); }

        .panel-marcador .jugador-info,
        .panel-marcador .cpu-info {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; min-width: 60px;
        }

        .panel-marcador .nombre {
            font-size: clamp(12px, 2.6vmin, 15px);
            font-weight: 800; letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.8);
            max-width: 100px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .panel-marcador .goles-numero {
            font-size: clamp(26px, 6.5vmin, 44px);
            font-weight: 900; color: var(--blanco);
            line-height: 1;
        }

        .panel-marcador .estrellas { display: flex; gap: 5px; font-size: clamp(15px, 3.8vmin, 20px); }
        .panel-marcador .estrellas .estrella { color: rgba(255, 255, 255, 0.2); transition: var(--transicion); }
        .panel-marcador .estrellas .estrella.encendida { color: var(--dorado); text-shadow: 0 0 8px rgba(200, 168, 78, 0.5); }

        .panel-marcador .centro-marcador {
            font-size: clamp(14px, 3.2vmin, 18px);
            font-weight: 800; letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .panel-marcador .minuto { font-size: clamp(13px, 2.8vmin, 16px); color: var(--dorado); }

        .carta-img { display: block; background: transparent; object-fit: contain; transition: var(--transicion); }
        .mano-cpu .carta-img { width: var(--carta-cpu); height: auto; max-height: var(--carta-cpu-max-h); }
        .mano-jugador .carta-img {
            width: var(--carta-mano); height: auto;
            max-height: var(--carta-mano-max-h);
            background: transparent;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
        }

        /* ============ OVERLAY LOBBY ============ */
        .overlay-lobby {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 300;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }
        .overlay-lobby.oculto { display: none; }

        .lobby-contenedor {
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            width: 100%; max-width: 400px;
            background: var(--gris-oscuro);
            border-radius: var(--borde-redondo);
            padding: 32px 24px;
            box-shadow: var(--sombra-carta);
        }

        .lobby-titulo { font-size: clamp(28px, 7vw, 40px); font-weight: 900; letter-spacing: -0.02em; color: var(--dorado); text-align: center; }
        .lobby-subtitulo { font-size: clamp(14px, 3.5vmin, 18px); font-weight: 600; color: rgba(255, 255, 255, 0.7); text-align: center; }
        .lobby-estado { font-size: clamp(13px, 3vmin, 15px); color: rgba(255, 255, 255, 0.5); text-align: center; min-height: 20px; }

        .lobby-codigo {
            font-size: clamp(24px, 6vmin, 36px);
            font-weight: 900; letter-spacing: 0.15em;
            color: var(--blanco);
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(200, 168, 78, 0.4);
            border-radius: 12px;
            padding: 12px 24px;
            text-align: center;
            user-select: all; -webkit-user-select: all;
        }

        .lobby-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #333;
            color: var(--blanco);
            font-size: clamp(16px, 4vmin, 20px);
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: var(--transicion);
            font-family: inherit;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .lobby-input:focus { border-color: var(--dorado); background: #3a3a3a; }
        .lobby-input::placeholder { color: rgba(255, 255, 255, 0.3); font-weight: 400; letter-spacing: 0.05em; text-transform: none; }

        .lobby-botones { display: flex; flex-direction: column; gap: 10px; width: 100%; }

        .btn-lobby {
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: clamp(15px, 3.5vmin, 18px);
            font-weight: 800; letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: var(--transicion);
            font-family: inherit;
        }

        .btn-rapido { background: #e67e22; color: #fff; }
        .btn-rapido:hover { background: #f08c34; box-shadow: 0 4px 20px rgba(230, 126, 34, 0.4); }
        .btn-crear { background: var(--dorado); color: #1a2a10; }
        .btn-crear:hover { background: var(--dorado-claro); box-shadow: 0 4px 20px rgba(200, 168, 78, 0.4); }
        .btn-unirse { background: #27ae60; color: #fff; }
        .btn-unirse:hover { background: #2ecc71; box-shadow: 0 4px 20px rgba(39, 174, 96, 0.4); }
        .btn-unirse:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-volver-lobby { background: transparent; color: var(--blanco); border: 2px solid rgba(255, 255, 255, 0.3); }
        .btn-volver-lobby:hover { border-color: var(--dorado); color: var(--dorado); background: rgba(200, 168, 78, 0.08); }

        .lobby-mensaje { font-size: clamp(12px, 2.8vmin, 14px); text-align: center; line-height: 1.4; min-height: 20px; color: #e74c3c; }
        .lobby-mensaje.ok { color: #2ecc71; }

        .lobby-jugadores { display: flex; justify-content: center; gap: 20px; width: 100%; padding: 8px 0; }

        .lobby-jugador {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 100px;
        }

        .lobby-jugador .jugador-nombre { font-size: clamp(13px, 3vmin, 15px); font-weight: 700; color: var(--blanco); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lobby-jugador .jugador-estado { font-size: clamp(10px, 2.4vmin, 12px); color: rgba(255, 255, 255, 0.5); }
        .lobby-jugador .jugador-estado.listo { color: #2ecc71; }
        .lobby-jugador .jugador-estado.esperando { color: var(--dorado); }
        .lobby-jugador .jugador-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); }
        .lobby-jugador .jugador-avatar.placeholder { display: flex; align-items: center; justify-content: center; background: var(--gris-medio); font-size: 20px; border-color: rgba(255, 255, 255, 0.2); }
        .lobby-vs { font-size: clamp(20px, 5vmin, 28px); font-weight: 900; color: var(--dorado); align-self: center; }

        /* Overlay esperando rival */
        .overlay-esperando {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 250;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .overlay-esperando.oculto { display: none; }
        .esperando-titulo { font-size: clamp(24px, 6vw, 36px); font-weight: 900; color: var(--dorado); text-align: center; }
        .esperando-subtitulo { font-size: clamp(14px, 3.5vmin, 18px); color: rgba(255, 255, 255, 0.7); text-align: center; }

        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: var(--dorado); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Overlay marcador detallado */
        .overlay-marcador {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .overlay-marcador.oculto { display: none; }
        .overlay-marcador .tabla-marcador { width: 100%; max-width: 500px; border-collapse: collapse; }
        .overlay-marcador .tabla-marcador th,
        .overlay-marcador .tabla-marcador td {
            padding: 14px 12px; text-align: center;
            font-size: clamp(16px, 4vmin, 22px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .overlay-marcador .tabla-marcador th {
            font-size: clamp(14px, 3.5vmin, 18px);
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }
        .overlay-marcador .tabla-marcador .fila-actual { background: rgba(200, 168, 78, 0.15); border-radius: 8px; }
        .overlay-marcador .tabla-marcador .fila-actual td { color: var(--dorado); font-weight: 700; }
        .overlay-marcador .btn-volver {
            margin-top: 24px; padding: 14px 40px;
            border-radius: 50px; font-size: 16px; font-weight: 700;
            letter-spacing: 0.04em;
            background: var(--blanco); color: var(--negro);
            border: none; cursor: pointer; transition: var(--transicion);
        }
        .overlay-marcador .btn-volver:hover { background: #fff; box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2); }

        /* Overlay fin */
        .overlay-fin {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; padding: 20px;
            animation: fadeIn 0.5s ease;
            overflow-y: auto;
        }

        /* Publicidad al final de la partida */
        .ads-fin {
            width: 100%;
            max-width: 480px;
            text-align: center;
            overflow: hidden;
        }

        .ads-fin ins.adsbygoogle {
            display: block;
            width: 100%;
        }
        .overlay-fin.oculto { display: none; }
        .overlay-fin .resultado-titulo { font-size: clamp(36px, 8vw, 60px); font-weight: 900; letter-spacing: -0.02em; text-align: center; }
        .overlay-fin .resultado-titulo.ganaste { color: #2ecc71; }
        .overlay-fin .resultado-titulo.perdiste { color: #e74c3c; }
        .overlay-fin .resultado-titulo.empate { color: var(--dorado); }
        .overlay-fin .resultado-marcador { font-size: 28px; font-weight: 700; color: var(--blanco); }

        function generarCodigoPartida() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let codigo = '';
            for (let i = 0; i < CODIGO_LENGTH; i++) codigo += chars.charAt(Math.floor(Math.random() * chars.length));
            return codigo;
        }

        function crearCarta(posicion, numero) {
            const nombresPos = { Arq: 'Arquero', Def: 'Defensor', Vol: 'Volante', Del: 'Delantero' };
            return { id: `${posicion}${numero}`, posicion, numero, nombre: `${nombresPos[posicion]} ${numero}`, imagen: `${RUTA_IMAGENES}${nombresPos[posicion]}${numero}.png` };
        }

        function crearMazo() {
            const mazo = [];
            for (const pos of POSICIONES) for (const num of NUMEROS) mazo.push(crearCarta(pos, num));
            return mazo;
        }

        function mezclarMazo(mazo) {
            const copia = [...mazo];
            for (let i = copia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copia[i], copia[j]] = [copia[j], copia[i]];
            }
            return copia;
        }

        function repartir(mazo) {
            const manoJ = [], manoR = [], restante = [...mazo];
            for (let i = 0; i < CARTAS_POR_JUGADOR; i++) { manoJ.push(restante.pop()); manoR.push(restante.pop()); }
            return { manoJ, manoR, mazoRestante: restante };
        }

        function ordenarMano(mano) {
            const orden = { Arq: 0, Def: 1, Vol: 2, Del: 3 };
            return [...mano].sort((a, b) => orden[a.posicion] - orden[b.posicion] || b.numero - a.numero);
        }

        function mejorCartaDe(mano, pos) {
            const cartas = mano.filter(c => c.posicion === pos);
            return cartas.length ? cartas.reduce((a, b) => a.numero > b.numero ? a : b) : null;
        }

        function mejorCartaDeVarias(mano, posiciones) {
            let mejor = null;
            for (const p of posiciones) {
                const c = mejorCartaDe(mano, p);
                if (c && (!mejor || c.numero > mejor.numero)) mejor = c;
            }
            return mejor;
        }

        function numeroMasAltoArqDel(mano) {
            return Math.max(mejorCartaDe(mano, 'Arq')?.numero || 0, mejorCartaDe(mano, 'Del')?.numero || 0);
        }

        function actualizarEscalado() {
            const vh = window.innerHeight, vw = window.innerWidth;
            const vmin = Math.min(vh, vw);
            const isWide = vw >= 768;
            const aspectRatio = 1039 / 744;
            const zonaCpu = vh * (isWide ? 0.055 : 0.09);
            const zonaBotones = isWide ? 0 : vh * 0.12;
            const zonaJugador = vh * (isWide ? 0.19 : 0.18);
            const zonaMarcador = vh * 0.08;
            const gaps = vh * 0.035;
            const espacioMesa = vh - zonaCpu - zonaBotones - zonaJugador - zonaMarcador - gaps;
            let cartaMesa = Math.min(espacioMesa * 0.52, vw * (isWide ? 0.24 : 0.42), vmin * 0.36, 210);
            cartaMesa = Math.max(cartaMesa, vmin * 0.15);
            let cartaMano = Math.min(zonaJugador * 0.95, vw * 0.34, cartaMesa * 1.25, vmin * 0.31, 200);
            cartaMano = Math.max(cartaMano, vmin * 0.16);
            let cartaCpu = Math.min(cartaMano * 0.8, vw * 0.2, vmin * 0.21, 140) * 0.8;
            cartaCpu = Math.max(cartaCpu, vmin * 0.13);
            const btnFont = Math.max(15, Math.min(24, vmin * 0.05));
            const btnPadY = Math.max(10, Math.min(20, vmin * 0.028));
            const btnPadX = Math.max(14, Math.min(32, vmin * 0.04));
            const manoAltura = cartaMano * aspectRatio + (isWide ? 18 : 14);
            const root = document.documentElement;
            root.style.setProperty('--carta-mesa', cartaMesa + 'px');
            root.style.setProperty('--carta-mesa-max-h', (cartaMesa * aspectRatio) + 'px');
            root.style.setProperty('--carta-mano', cartaMano + 'px');
            root.style.setProperty('--carta-mano-max-h', (cartaMano * aspectRatio) + 'px');
            root.style.setProperty('--carta-cpu', cartaCpu + 'px');
            root.style.setProperty('--carta-cpu-max-h', (cartaCpu * aspectRatio) + 'px');
            root.style.setProperty('--mano-altura', manoAltura + 'px');
            root.style.setProperty('--btn-font', btnFont + 'px');
            root.style.setProperty('--btn-pad-y', btnPadY + 'px');
            root.style.setProperty('--btn-pad-x', btnPadX + 'px');
        }

        function renderizarManoJugador() {
            dom.manoJugador.innerHTML = '';
            const mano = estado.juego.manoJugador;
            const style = getComputedStyle(document.documentElement);
            const anchoCarta = parseFloat(style.getPropertyValue('--carta-mano')) || 100;
            const manoAltura = parseFloat(style.getPropertyValue('--mano-altura')) || 130;
            if (!mano.length) { dom.manoJugador.style.height = manoAltura + 'px'; return; }
            const anchoDisponible = Math.min(window.innerWidth - 32, 920);
            let anchoCartaJugador = anchoCarta * 1.25;
            const factorSuperp = 0.85;
            let superp = anchoCartaJugador * factorSuperp;
            const anchoTotal = (mano.length - 1) * superp + anchoCartaJugador;
            if (anchoTotal > anchoDisponible) {
                anchoCartaJugador = anchoDisponible / (1 + (mano.length - 1) * factorSuperp);
                superp = anchoCartaJugador * factorSuperp;
            }
            if (anchoCartaJugador > anchoDisponible) { anchoCartaJugador = anchoDisponible; superp = anchoCartaJugador * factorSuperp; }
            const offsetBase = (anchoDisponible - ((mano.length - 1) * superp + anchoCartaJugador)) / 2;
            dom.manoJugador.style.height = manoAltura + 'px';
            mano.forEach((carta, i) => {
                const cont = document.createElement('div');
                cont.className = 'carta-contenedor';
                cont.dataset.index = i;
                cont.style.zIndex = i;
                cont.style.left = `${offsetBase + i * superp}px`;
                if (estado.juego.cartaSeleccionada === i) { cont.classList.add('seleccionada'); cont.style.zIndex = 20; }
                const img = document.createElement('img');
                img.src = carta.imagen;
                img.className = 'carta-img';
                img.draggable = false;
                img.style.width = anchoCartaJugador + 'px';
                cont.appendChild(img);
                cont.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (estado.fase !== 'jugando') return;
                    if (estado.juego.fase !== 'esperando_seleccion') return;
                    if (estado.juego.turnoActual !== 'jugador') return;
                    if (estado.juego.cartaSeleccionada === i) { jugarCartaSeleccionada(); }
                    else { estado.juego.cartaSeleccionada = i; renderizarManoJugador(); }
                });
                dom.manoJugador.appendChild(cont);
            });
        }

        function renderizarMesa() {
            dom.mesaCartas.innerHTML = '';
            const esMovil = window.innerWidth < 768;

            // Durante un canto (penal/gol/golazo) solo se muestran las cartas del canto,
            // para que se vean bien y no se mezclen con las de rondas anteriores.
            let cartasVisibles;
            if (estado.juego.penalActivo && estado.juego.penalCartas.length) {
                cartasVisibles = estado.juego.penalCartas;
            } else if (estado.juego.golActivo && estado.juego.golCartas.length) {
                cartasVisibles = estado.juego.golCartas;
            } else {
                const inicio = estado.juego.inicioRonda || 0;
                cartasVisibles = estado.juego.cartasEnMesa.slice(inicio);
            }
            if (!cartasVisibles.length) return;

            const filaMesa = document.createElement('div');
            filaMesa.className = 'mesa-fila';

            // Agrupar cartas por ronda (de a 2: una mía + una del rival)
            const rondas = [];
            for (let i = 0; i < cartasVisibles.length; i += 2) {
                rondas.push(cartasVisibles.slice(i, i + 2));
            }

            let idxGlobal = 0;
            rondas.forEach((ronda, ri) => {
                const uj = ronda.find(c => c.origen === 'jugador');
                const ur = ronda.find(c => c.origen === 'rival');
                const ambos = uj && ur;
                // Quién gana el enfrentamiento de esta ronda
                let ganadorOrigen = null;
                if (ambos) {
                    if (uj.carta.numero > ur.carta.numero) ganadorOrigen = 'jugador';
                    else if (ur.carta.numero > uj.carta.numero) ganadorOrigen = 'rival';
                }
                const esRondaActual = ri === rondas.length - 1;

                ronda.forEach((item) => {
                    const cont = document.createElement('div');
                    cont.className = 'carta-contenedor';
                    const img = document.createElement('img');
                    img.src = item.carta.imagen;
                    img.className = 'carta-img';
                    img.draggable = false;
                    cont.appendChild(img);
                    cont.style.zIndex = ++idxGlobal;

                    const esRival = item.origen === 'rival';
                    // Si ambas cartas están en la mesa, se superponen como en un juego real:
                    // cada carta queda del lado de quien la tiró y se acercan al enfrentar.
                    // En móvil se baja un poco el grupo para que no tape el
                    // texto "Turno de ..." ni los botones; en PC queda centrado.
                    const sep = ambos ? (esMovil ? 7 : 12) : (esMovil ? 10 : 24);
                    const ty = esRival ? -sep : sep;
                    const tx = (ri % 2 === 0 ? -1 : 1) * 8;

                    cont.style.top = esMovil ? '95%' : '50%';
                    cont.style.left = '50%';
                    cont.style.transform = `translate(-50%, -50%) translateX(${tx}px) translateY(${ty}%)`;

                    // Resaltar quién mata a quién
                    if (ganadorOrigen === item.origen) {
                        cont.classList.add('ganadora-ronda');
                    } else if (ganadorOrigen) {
                        cont.classList.add('perdedora-ronda');
                    }
                    // Rondas anteriores se atenúan
                    if (!esRondaActual) cont.style.opacity = '0.45';

                    filaMesa.appendChild(cont);
                });
            });
            dom.mesaCartas.appendChild(filaMesa);
        }

        // ============ CONVERSIÓN DE LADOS ============
        // En Firebase: 'jugador' = creador, 'rival' = unido (absoluto)
        // Localmente: 'jugador' = yo, 'rival' = oponente (relativo)
        function aAbsoluto(valor) {
            if (valor === null || valor === undefined) return null;
            if (valor === 'jugador') return estado.miLado;
            if (valor === 'rival') return estado.miLado === 'jugador' ? 'rival' : 'jugador';
            return valor;
        }

        function aRelativo(valor) {
            if (valor === null || valor === undefined) return null;
            if (valor === 'jugador') return estado.miLado === 'jugador' ? 'jugador' : 'rival';
            if (valor === 'rival') return estado.miLado === 'jugador' ? 'rival' : 'jugador';
            return valor;
        }

        // ============ CIFRADO DE MANOS (Web Crypto) 1/2 ============
        // Las cartas ocultas NUNCA viajan en texto plano por Firebase.
        // - Cada jugador genera una clave AES-256 aleatoria que SOLO existe en su
        //   memoria: nunca se publica. Su mano siempre se guarda cifrada con ella.
        // - La mano inicial del rival viaja como un "regalo" cifrado con ECDH
        //   efímero + la clave pública estática del receptor: solo el dueño puede
        //   abrirlo y la clave efímera se descarta tras el reparto.
        // Limitación inherente sin servidor: quien mezcla conoce la mano inicial
        // del rival en ese momento; después pierde todo acceso a sus cartas.
        const clavesCrypto = {
            lista: false, parEstatico: null, claveManoAES: null,
            inicializando: null, ultimaFirmaVista: null
        };
        let tokenManoRemota = 0;

        function u8aABase64(bytes) { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); }
        function base64AU8a(b64) { const s = atob(b64); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }

        // Mano "fantasma": solo la CANTIDAD de cartas del rival (nunca cuáles son)
        function crearManoFantasma(n) {
            return Array.from({ length: n }, () => ({ id: '', posicion: '', numero: 0, nombre: '', imagen: '' }));
        }

        async function esperarDato(ruta, tiempoMaxMs = 20000) {
            const inicio = Date.now();
            while (Date.now() - inicio < tiempoMaxMs) {
                const snap = await get(ref(db, ruta));
                if (snap.exists()) return snap.val();
                await new Promise(r => setTimeout(r, 300));
            }
            throw new Error('Tiempo agotado esperando ' + ruta);
        }

        async function cifrarCon(clave, texto) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const cifrado = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, clave, new TextEncoder().encode(texto));
            return { d: u8aABase64(new Uint8Array(cifrado)), i: u8aABase64(iv) };
        }

        async function descifrarTexto(clave, paquete) {
            const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64AU8a(paquete.i) }, clave, base64AU8a(paquete.d));
            return new TextDecoder().decode(plano);
        }

        // Genera mi par ECDH estático (publica solo la clave PÚBLICA) y mi clave
        // AES local para mis manos (esta jamás sale de este dispositivo)
        function asegurarClavesCifradas() {
            if (!estado.usuario || !estado.partidaId || !estado.miLado) return Promise.resolve();
            if (clavesCrypto.lista) return Promise.resolve();
            if (clavesCrypto.inicializando) return clavesCrypto.inicializando;
            clavesCrypto.inicializando = (async () => {
                if (!clavesCrypto.parEstatico) {
                    clavesCrypto.parEstatico = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
                    const pubRaw = new Uint8Array(await crypto.subtle.exportKey('raw', clavesCrypto.parEstatico.publicKey));
                    await set(ref(db, 'partidas/' + estado.partidaId + '/clavesPub/' + estado.miLado), u8aABase64(pubRaw));
                    const bytes = crypto.getRandomValues(new Uint8Array(32));
                    clavesCrypto.claveManoAES = await crypto.subtle.importKey('raw', bytes, 'AES-GCM', false, ['encrypt', 'decrypt']);
                }
                clavesCrypto.lista = true;
            })();
            const promesa = clavesCrypto.inicializando.finally(() => { clavesCrypto.inicializando = null; });
            promesa.catch(() => {});
            return promesa;
        }

        async function cifrarManoPropia(mano) {
            await asegurarClavesCifradas();
            return cifrarCon(clavesCrypto.claveManoAES, JSON.stringify(mano));
        }

        // ============ CIFRADO DE MANOS (Web Crypto) 2/2 ============
        // "Regalo" del reparto: cifra la mano del rival con una clave efímera ECDH
        // que solo el destinatario puede derivar con su clave privada. La privada
        // efímera se descarta acá: ni el repartidor puede volver a abrir el sobre.
        async function cifrarRegalo(mano, ladoDestino) {
            await asegurarClavesCifradas();
            const pubDestinoRaw = await esperarDato('partidas/' + estado.partidaId + '/clavesPub/' + ladoDestino);
            const pubDestino = await crypto.subtle.importKey('raw', base64AU8a(pubDestinoRaw), { name: 'ECDH', namedCurve: 'P-256' }, true, []);
            const efimera = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pubDestino }, efimera.privateKey, 256);
            const claveRegalo = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['encrypt']);
            const paquete = await cifrarCon(claveRegalo, JSON.stringify(mano));
            const epk = u8aABase64(new Uint8Array(await crypto.subtle.exportKey('raw', efimera.publicKey)));
            return { tipo: 'regalo', epk, d: paquete.d, i: paquete.i };
        }

        async function cifrarAmbasManos(mia, delRival) {
            const ladoRival = estado.miLado === 'jugador' ? 'rival' : 'jugador';
            return {
                ['manos/' + estado.miLado]: await cifrarManoPropia(mia),
                ['manos/' + ladoRival]: await cifrarRegalo(delRival, ladoRival)
            };
        }

        async function descifrarManoPropia(paquete) {
            if (paquete.tipo === 'regalo') {
                const epk = await crypto.subtle.importKey('raw', base64AU8a(paquete.epk), { name: 'ECDH', namedCurve: 'P-256' }, true, []);
                const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: epk }, clavesCrypto.parEstatico.privateKey, 256);
                const claveRegalo = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
                return JSON.parse(await descifrarTexto(claveRegalo, paquete));
            }
            await asegurarClavesCifradas();
            return JSON.parse(await descifrarTexto(clavesCrypto.claveManoAES, paquete));
        }

        // Descifra (con reintento) la mano propia cuando llega una versión nueva
        // cifrada desde Firebase. La mano propia JAMÁS se lee en claro.
        function intentarDescifrarManoRemota(paquete, intento = 0) {
            if (!paquete || !paquete.d) return;
            const firma = paquete.d + '|' + paquete.i;
            if (firma === clavesCrypto.ultimaFirmaVista) return;
            if (!clavesCrypto.lista || !clavesCrypto.parEstatico) {
                if (intento < 60) setTimeout(() => intentarDescifrarManoRemota(paquete, intento + 1), 500);
                return;
            }
            clavesCrypto.ultimaFirmaVista = firma;
            const token = ++tokenManoRemota;
            descifrarManoPropia(paquete).then((mano) => {
                if (token !== tokenManoRemota || !Array.isArray(mano) || !mano.length) return;
                estado.juego.manoJugador = mano;
                // Si era el regalo del reparto, sobrescribirlo con mi mano cifrada
                // con MI clave local para no dejar el sobre efímero en Firebase
                if (paquete.tipo === 'regalo') { reescribirManoPropia().catch(() => {}); }
                if (estado.fase === 'jugando' || estado.fase === 'fin') renderizarTodo();
            }).catch((err) => console.warn('No se pudo descifrar la mano propia:', err));
        }

        // Reescribe mi mano cifrada con MI clave (reemplaza cualquier regalo)
        function reescribirManoPropia() {
            return cifrarManoPropia(estado.juego.manoJugador).then((cifrada) => {
                if (!estado.partidaId) return;
                return update(ref(db, 'partidas/' + estado.partidaId + '/juego'), { ['manos/' + estado.miLado]: cifrada });
            });
        }

        // ============ SINCRONIZACIÓN ============
        let colaSync = Promise.resolve();
        function sincronizarJuego(manosCifradas) {
            colaSync = colaSync.then(() => escribirEstadoJuego(manosCifradas))
                .catch((error) => console.error('Error sincronizando:', error));
        }

        async function escribirEstadoJuego(manosCifradas) {
            if (!estado.partidaId) return;
            await asegurarClavesCifradas();
            const juegoRef = ref(db, 'partidas/' + estado.partidaId + '/juego');
            const datos = {};
            // Manos: cada cliente escribe SOLO la suya, cifrada con su clave local.
            // Del rival solo se publica cuántas cartas le quedan, nunca cuáles son.
            if (manosCifradas) Object.assign(datos, manosCifradas);
            else datos['manos/' + estado.miLado] = await cifrarManoPropia(estado.juego.manoJugador);
            datos.nCartasJugador = estado.miLado === 'jugador' ? estado.juego.manoJugador.length : estado.juego.manoRival.length;
            datos.nCartasRival = estado.miLado === 'jugador' ? estado.juego.manoRival.length : estado.juego.manoJugador.length;
            Object.assign(datos, {
                golesJugador: estado.miLado === 'jugador' ? estado.juego.golesJugador : estado.juego.golesRival,
                golesRival: estado.miLado === 'jugador' ? estado.juego.golesRival : estado.juego.golesJugador,
                puntosJugador: estado.miLado === 'jugador' ? estado.juego.puntosJugador : estado.juego.puntosRival,
                puntosRival: estado.miLado === 'jugador' ? estado.juego.puntosRival : estado.juego.puntosJugador,
                puntosManoJugador: estado.miLado === 'jugador' ? estado.juego.puntosManoJugador : estado.juego.puntosManoRival,
                puntosManoRival: estado.miLado === 'jugador' ? estado.juego.puntosManoRival : estado.juego.puntosManoJugador,
                manoActual: estado.juego.manoActual,
                rondaActual: estado.juego.rondaActual,
                turnoInicial: aAbsoluto(estado.juego.turnoInicial),
                turnoActual: aAbsoluto(estado.juego.turnoActual),
                cartasEnMesa: estado.juego.cartasEnMesa.map(c => ({ ...c, origen: aAbsoluto(c.origen) })),
                fase: estado.juego.fase,
                penalUsado: estado.juego.penalUsado,
                penalCantadoPor: aAbsoluto(estado.juego.penalCantadoPor),
                penalActivo: estado.juego.penalActivo,
                penalAtacante: aAbsoluto(estado.juego.penalAtacante),
                penalCartas: estado.juego.penalCartas.map(c => ({ ...c, origen: aAbsoluto(c.origen) })),
                golActivo: estado.juego.golActivo,
                golAtacante: aAbsoluto(estado.juego.golAtacante),
                golCartas: estado.juego.golCartas.map(c => ({ ...c, origen: aAbsoluto(c.origen) })),
                golUsado: estado.juego.golUsado,
                golazoUsado: estado.juego.golazoUsado,
                cantoActual: estado.juego.cantoActual,
                cantoPedidoPor: aAbsoluto(estado.juego.cantoPedidoPor),
                cantoPendiente: estado.juego.cantoPendiente ? { ...estado.juego.cantoPendiente, pedidoPor: aAbsoluto(estado.juego.cantoPendiente.pedidoPor) } : null,
                varPedidoPor: aAbsoluto(estado.juego.varPedidoPor),
                varDeclaraciones: {
                    jugador: estado.miLado === 'jugador' ? estado.juego.varDeclaraciones.jugador : estado.juego.varDeclaraciones.rival,
                    rival: estado.miLado === 'jugador' ? estado.juego.varDeclaraciones.rival : estado.juego.varDeclaraciones.jugador
                },
                varTurnoDeclarar: aAbsoluto(estado.juego.varTurnoDeclarar),
                varPanelVisible: estado.juego.varPanelVisible,
                esperandoRespuestaDe: aAbsoluto(estado.juego.esperandoRespuestaDe),
                historialManos: estado.juego.historialManos.map(h => ({
                    ...h,
                    turnoInicial: aAbsoluto(h.turnoInicial),
                    golesJugador: estado.miLado === 'jugador' ? h.golesJugador : h.golesRival,
                    golesRival: estado.miLado === 'jugador' ? h.golesRival : h.golesJugador,
                    puntosJugador: estado.miLado === 'jugador' ? h.puntosJugador : h.puntosRival,
                    puntosRival: estado.miLado === 'jugador' ? h.puntosRival : h.puntosJugador,
                })),
                inicioRonda: estado.juego.inicioRonda,
                ganadorManoAnterior: aAbsoluto(estado.juego.ganadorManoAnterior),
                golEnMano: estado.juego.golEnMano,
                golesInicioManoJugador: estado.miLado === 'jugador' ? estado.juego.golesInicioManoJugador : estado.juego.golesInicioManoRival,
                golesInicioManoRival: estado.miLado === 'jugador' ? estado.juego.golesInicioManoRival : estado.juego.golesInicioManoJugador
            });
            datos.ultimaActividad = Date.now();
            await update(juegoRef, datos);
        }

        // ============ ACCIONES DE JUEGO ============
        function jugarCartaSeleccionada() {
            if (estado.fase !== 'jugando') return;
            if (estado.juego.fase !== 'esperando_seleccion') return;
            if (estado.juego.turnoActual !== 'jugador') return;
            if (estado.juego.cartaSeleccionada === null) return;

            const idx = estado.juego.cartaSeleccionada;
            const carta = estado.juego.manoJugador[idx];
            if (!carta) return;

            estado.juego.manoJugador.splice(idx, 1);
            estado.juego.cartaSeleccionada = null;
            estado.juego.cartasEnMesa.push({ carta, origen: 'jugador' });

            // Si hay penal activo
            if (estado.juego.penalActivo) {
                estado.juego.penalCartas.push({ carta, origen: 'jugador' });
                if (estado.juego.penalCartas.some(c => c.origen === 'rival')) {
                    estado.juego.fase = 'resolviendo';
                    sincronizarJuego();
                    renderizarTodo();
                    setTimeout(resolverRonda, 500);
                } else {
                    estado.juego.fase = 'esperando_rival';
                    estado.juego.turnoActual = 'rival';
                    sincronizarJuego();
                    renderizarTodo();
                }
                return;
            }

            // Si hay gol activo
            if (estado.juego.golActivo) {
                estado.juego.golCartas.push({ carta, origen: 'jugador' });
                if (estado.juego.golCartas.some(c => c.origen === 'rival')) {
                    estado.juego.fase = 'resolviendo';
                    sincronizarJuego();
                    renderizarTodo();
                    setTimeout(resolverRonda, 500);
                } else {
                    estado.juego.fase = 'esperando_rival';
                    estado.juego.turnoActual = 'rival';
                    sincronizarJuego();
                    renderizarTodo();
                }
                return;
            }

            // Juego normal
            if (rivalJugoEstaRonda()) {
                estado.juego.fase = 'resolviendo';
                sincronizarJuego();
                renderizarTodo();
                setTimeout(resolverRonda, 500);
            } else {
                estado.juego.fase = 'esperando_rival';
                estado.juego.turnoActual = 'rival';
                sincronizarJuego();
                renderizarTodo();
            }

            reproducirSonido('carta');
        }

        // ============ FIREBASE: CREAR PARTIDA ============
        async function crearPartida() {
            if (!estado.usuario) return;
            mostrarLobbyMensaje('Creando partida...', false);
            dom.btnCrearPartida.disabled = true;
            try {
                let codigo = generarCodigoPartida();
                let existe = true;
                let intentos = 0;
                while (existe && intentos < 10) {
                    const snap = await get(ref(db, 'partidas/' + codigo));
                    existe = snap.exists();
                    if (existe) { codigo = generarCodigoPartida(); intentos++; }
                }
                if (existe) { mostrarLobbyMensaje('Error generando código. Intentá de nuevo.', true); dom.btnCrearPartida.disabled = false; return; }
                const partidaRef = ref(db, 'partidas/' + codigo);
                await set(partidaRef, {
                    codigo, creador: { uid: estado.usuario.uid, nickname: estado.nickname || 'Jugador', fotoURL: estado.fotoURL || '', listo: true },
                    unido: null, estado: 'esperando', creadoEn: Date.now(), ultimaActividad: Date.now()
                });
                estado.partidaId = codigo;
                estado.miLado = 'jugador';
                estado.fase = 'esperando';
                estado.esPartidaRapida = false;
                // Si me desconecto durante la espera, borrar partida y cola solos
                registrarLimpiezaEspera(codigo);
                dom.overlayLobby.classList.add('oculto');
                dom.overlayEsperando.classList.remove('oculto');
                dom.codigoPartida.textContent = codigo;
                dom.esperandoTitulo.textContent = 'Esperando rival...';
                dom.esperandoSubtitulo.textContent = 'Compartí este código con tu rival';
                // Habilitar la advertencia de salida mientras se espera
                empujarEstadoEspera();
                escucharPartida(codigo);
            } catch (error) {
                console.error('Error creando partida:', error);
                mostrarLobbyMensaje('Error al crear la partida. Revisá tu conexión.', true);
                dom.btnCrearPartida.disabled = false;
            }
        }

        // ============ FIREBASE: UNIRSE ============
        async function unirsePartida() {
            if (!estado.usuario) return;
            const codigo = dom.inputCodigo.value.trim().toUpperCase();
            if (codigo.length !== CODIGO_LENGTH) { mostrarLobbyMensaje('El código debe tener ' + CODIGO_LENGTH + ' caracteres.', true); return; }
            mostrarLobbyMensaje('Buscando partida...', false);
            dom.btnUnirsePartida.disabled = true;
            try {
                const partidaRef = ref(db, 'partidas/' + codigo);
                const snap = await get(partidaRef);
                if (!snap.exists()) { mostrarLobbyMensaje('No se encontró ninguna partida con ese código.', true); dom.btnUnirsePartida.disabled = false; return; }
                const partida = snap.val();
                if (partida.estado !== 'esperando') { mostrarLobbyMensaje('Esa partida ya comenzó o terminó.', true); dom.btnUnirsePartida.disabled = false; return; }
                if (partida.unido) { mostrarLobbyMensaje('Esa partida ya tiene 2 jugadores.', true); dom.btnUnirsePartida.disabled = false; return; }
                if (partida.creador.uid === estado.usuario.uid) { mostrarLobbyMensaje('Ya sos el creador de esa partida.', true); dom.btnUnirsePartida.disabled = false; return; }
                await update(partidaRef, {
                    unido: { uid: estado.usuario.uid, nickname: estado.nickname || 'Jugador', fotoURL: estado.fotoURL || '', listo: true },
                    estado: 'jugando', ultimaActividad: Date.now()
                });
                estado.partidaId = codigo;
                estado.miLado = 'rival';
                estado.fase = 'esperando';
                // Registrar salida repentina YA: si cierro la pestaña antes de
                // que el creador reparta, el ve mi abandono y no queda solo
                registrarSalidaRepentina();
                dom.overlayLobby.classList.add('oculto');
                dom.overlayEsperando.classList.add('oculto');
                dom.nombreRivalEtiqueta.textContent = partida.creador.nickname || 'Rival';
                estado.rivalNombre = partida.creador.nickname || 'Rival';
                empujarEstadoEspera();
                escucharPartida(codigo);
            } catch (error) {
                console.error('Error uniéndose a partida:', error);
                mostrarLobbyMensaje('Error al unirse. Revisá tu conexión.', true);
                dom.btnUnirsePartida.disabled = false;
            }
        }

        // ============ FIREBASE: JUGAR RÁPIDO (MATCHMAKING) ============
        let buscandoRapido = false;
        let colaRapidoListener = null;

        // Intenta unirse a la partida de un rival que está esperando en la cola
        // de matchmaking. Devuelve true si la unión fue exitosa.
        // Diseño a prueba de fallos:
        // - La entrada de la cola del rival SOLO SE LEE, jamás se escribe ni se
        //   transacciona: funciona aunque las reglas restrinjan escrituras ajenas.
        // - La exclusión mutua la da UNA transacción sobre LA PARTIDA (el mismo
        //   nodo que ya escribe 'unirsePartida' por código): si dos jugadores
        //   intentan entrar al mismo hueco, SOLO uno logra escribir 'unido'.
        // - SIMETRÍA: solo se intenta con rivales de uid MENOR que el mío. Entre
        //   dos jugadores esperando a la vez, siempre uno solo inicia la unión,
        //   así nadie termina como "rival en la partida del otro".
        // - SI YO SOY ANFITRIÓN: primero libero MI propia partida con una
        //   transacción que solo procede si TODAVÍA no tiene rival (si alguien
        //   me acaba de unir a mí, me quedo y aborto). Después me uno al otro.
        let uniendoRapido = false;

        // Reanuda la búsqueda rápida de forma SEGURA tras un intento de unión
        // que falló a mitad de camino (cuando ya liberé mi propia partida).
        // Antes se usaba setTimeout(jugarRapido, 50): si el flag buscandoRapido
        // seguía en true (la llamada original aún estaba corriendo), el reintento
        // se descartaba en silencio y el jugador quedaba como ZOMBIE: spinner
        // eterno de "Buscando rival...", sin partida, sin listener de partida ni
        // de cola y sin bucle de emparejamiento → nunca se emparejaba con nadie.
        function reanudarBusquedaRapida(intento = 0) {
            setTimeout(async () => {
                try {
                    if (estado.enPartida || estado.fase === 'jugando' || estado.fase === 'fin') return;
                    if (estaEsperando()) return; // ya estoy esperando con mecanismos vivos
                    if (uniendoRapido) { if (intento < 20) reanudarBusquedaRapida(intento + 1); return; }
                    buscandoRapido = false; // liberar el flag por si quedó tomado
                    await jugarRapido();
                } catch (e) { console.error('Error reanudando búsqueda rápida:', e); }
            }, 400);
        }
        // Diagnóstico: muestra UNA sola vez el error real de Firebase en pantalla,
        // para que un fallo del matchmaking jamás quede en silencio.
        let avisoErrorMostrado = false;
        function avisarErrorUnaVez(err) {
            if (avisoErrorMostrado) return;
            avisoErrorMostrado = true;
            const cod = String((err && (err.code || err.message)) || 'desconocido').slice(0, 70);
            mostrarMensaje('⚠ Emparejamiento: ' + cod);
        }
        async function intentarUnirseRapido(rivalKey) {
            if (uniendoRapido || !estado.usuario) return false;
            if (estado.enPartida || estado.fase === 'fin') return false;
            if (estado.partidaId && estado.miLado === 'rival') return false;
            uniendoRapido = true;
            let libereMiPartida = false;
            try {
                const miUid = estado.usuario.uid;
                const entradaSnap = await get(ref(db, 'cola_rapido/' + rivalKey));
                const datos = entradaSnap.val();
                if (!datos || !datos.partidaId || !datos.uid || datos.uid === miUid) return false;
                if (datos.uid > miUid) return false; // simetría: solo rivales con uid menor

                // Pre-chequeo: la partida del rival debe existir, estar 'esperando'
                // y sin rival ANTES de liberar la mía (evita liberarme al pedo si
                // la entrada de la cola apunta a una partida ya tomada/borrada)
                const preSnap = await get(ref(db, 'partidas/' + datos.partidaId));
                const pre = preSnap.val();
                if (!pre || pre.estado !== 'esperando' || (pre.unido && pre.unido.uid) ||
                    !pre.creador) {
                    // Entrada FANTASMA o que apunta a una partida muerta/ya tomada
                    // (terminada, borrada, con rival...): limpiarla acá mismo para
                    // que no envenene el matchmaking de ningún otro jugador
                    if (!pre || pre.estado !== 'esperando') remove(ref(db, 'cola_rapido/' + rivalKey)).catch(() => {});
                    return false;
                }

                // PASO 1 (solo anfitriones): liberar MI partida sin rivales
                if (estado.partidaId && estado.miLado === 'jugador') {
                    cancelarRegistroDesconexion();
                    detenerEscuchaColaRapido();
                    detenerReintentoEmparejamiento();
                    detenerEscuchaPartida();
                    const mia = await runTransaction(ref(db, 'partidas/' + estado.partidaId), (p) => {
                        if (!p || p.estado !== 'esperando' || p.unido ||
                            !p.creador || p.creador.uid !== miUid) return undefined;
                        return null; // liberada: nadie se me había unido aún
                    });
                    if (!(mia.committed)) {
                        // Un rival me unió a MÍ mientras tanto: restaurar mi partida
                        estado.fase = 'esperando';
                        escucharPartida(estado.partidaId);
                        registrarSalidaRepentina();
                        return false;
                    }
                    remove(ref(db, 'cola_rapido/' + miUid)).catch(() => {});
                    libereMiPartida = true;
                    estado.partidaId = null;
                    estado.miLado = null;
                    estado.fase = 'lobby';
                }

                // PASO 2: ocupar el hueco de 'unido'. PRIMERO con transacción
                // sobre ese campo (atómica y compatible con las reglas); si por
                // CUALQUIER motivo la transacción falla o es rechazada en
                // producción, CAE AL MÉTODO CLÁSICO (re-verificar el hueco +
                // update parcial, idéntico al de "Unirse por código", que ya
                // funciona). La unión nunca queda bloqueada por la transacción.
                const partidaRef = ref(db, 'partidas/' + datos.partidaId);
                const miFicha = { uid: miUid, nickname: estado.nickname || 'Jugador', fotoURL: estado.fotoURL || '', listo: true };
                let ocupeHueco = false;
                try {
                    const unidoRef = ref(db, 'partidas/' + datos.partidaId + '/unido');
                    const resultado = await runTransaction(unidoRef, (actual) => {
                        if (actual) return undefined; // ya hay rival: abortar
                        return miFicha;
                    });
                    ocupeHueco = resultado.committed && resultado.snapshot.exists();
                } catch (txErr) {
                    console.error('Transacción sobre /unido falló, usando método clásico:', txErr);
                    avisarErrorUnaVez(txErr);
                }
                if (!ocupeHueco) {
                    // Método clásico: releer el hueco JUSTO antes de escribir y
                    // ocuparlo con update parcial. La ventana de carrera es de
                    // milisegundos y el re-chequeo descarta dobles rivales.
                    const fSnap = await get(partidaRef);
                    const f = fSnap.val();
                    if (!f || f.estado !== 'esperando' || (f.unido && f.unido.uid) || !f.creador) {
                        // El hueco se cerró entre medias: seguir buscando
                        if (libereMiPartida) reanudarBusquedaRapida();
                        return false;
                    }
                    try {
                        await update(partidaRef, { unido: miFicha, estado: 'jugando', ultimaActividad: Date.now() });
                    } catch (upErr) {
                        console.error('Error en unión clásica:', upErr);
                        avisarErrorUnaVez(upErr);
                        if (libereMiPartida) reanudarBusquedaRapida();
                        return false;
                    }
                }
                // Confirmar que la partida sigue viva (si fue borrada justo
                // antes, nuestra escritura habría recreado un nodo parcial:
                // limpiarlo y seguir buscando) y marcarla como 'jugando'.
                const confirmaSnap = await get(partidaRef);
                const confirma = confirmaSnap.val();
                if (!confirma || !confirma.creador) {
                    await remove(partidaRef).catch(() => {});
                    if (libereMiPartida) reanudarBusquedaRapida();
                    return false;
                }
                await update(partidaRef, { estado: 'jugando', ultimaActividad: Date.now() })
                    .catch((e) => console.error('Error marcando partida jugando:', e));

                // Éxito: limpiar entradas de la cola (la mía siempre; la del rival
                // mejor-esfuerzo, por si las reglas impiden borrar la ajena)
                remove(ref(db, 'cola_rapido/' + miUid)).catch(() => {});
                remove(ref(db, 'cola_rapido/' + rivalKey)).catch(() => {});
                detenerEscuchaColaRapido();
                detenerReintentoEmparejamiento();

                estado.partidaId = datos.partidaId;
                estado.miLado = 'rival';
                estado.fase = 'esperando';
                estado.esPartidaRapida = true;
                dom.overlayLobby.classList.add('oculto');
                dom.overlayEsperando.classList.add('oculto');
                dom.nombreRivalEtiqueta.textContent = datos.nickname || 'Rival';
                estado.rivalNombre = datos.nickname || 'Rival';
                registrarSalidaRepentina();
                escucharPartida(datos.partidaId);
                return true;
            } catch (error) {
                console.error('Error intentando unirse rápido:', error);
                if (libereMiPartida) reanudarBusquedaRapida();
                return false;
            } finally {
                uniendoRapido = false;
            }
        }

        // BUCLE DE ESPERA (único dueño del mantenimiento mientras espero como
        // anfitrión): cada 3 segundos hace, en orden fijo y sin timers cruzados:
        //   1. Escanear la cola e intentar unirme al primer candidato libre.
        //   2. Si MI partida desapareció de Firebase (borrada a mano, barrido,
        //      corrupción) → reinicio limpio y búsqueda desde cero.
        //   3. Si llevo >60 s esperando sin rival → RECREO mi partida con código
        //      nuevo: refresca mi presencia en la cola ante los demás y elimina
        //      cualquier estado invisible trabado. Garantiza que nunca quede
        //      nadie esperando infinitamente, pase lo que pase.
        let bucleEsperaTimer = null;
        let esperaIniciadaEn = 0;
        function iniciarReintentoEmparejamiento() {
            detenerReintentoEmparejamiento();
            esperaIniciadaEn = Date.now();
            bucleEsperaTimer = setInterval(async () => {
                try {
                    if (!estado.usuario || estado.enPartida ||
                        (estado.partidaId && estado.miLado === 'rival') || estado.fase !== 'esperando') {
                        detenerReintentoEmparejamiento();
                        return;
                    }
                    // 1) Intentar unirme a algún candidato libre de la cola
                    const snap = await get(ref(db, 'cola_rapido'));
                    const candidatos = [];
                    if (snap.exists()) {
                        snap.forEach((child) => {
                            const val = child.val();
                            if (val && val.uid && val.uid !== estado.usuario.uid) candidatos.push(child.key);
                        });
                    }
                    for (const key of candidatos) {
                        if (await intentarUnirseRapido(key)) return; // éxito: corta el bucle
                    }
                    // 2) ¿Mi partida sigue viva y esperando?
                    if (!estado.partidaId) { await recrearMiPartidaEspera(); return; }
                    const s = await get(ref(db, 'partidas/' + estado.partidaId));
                    const p = s.val();
                    if (!p || p.estado !== 'esperando') {
                        // ¿El rival acaba de entrar? No tocar: el listener arranca
                        if (p && p.unido) return;
                        await recrearMiPartidaEspera();
                        return;
                    }
                    // 3) Más de 60 s sin rival → recrear con código nuevo
                    if (!uniendoRapido && Date.now() - esperaIniciadaEn > 60000) {
                        await recrearMiPartidaEspera();
                    }
                } catch (e) { /* silencioso: se reintenta en el próximo ciclo */ }
            }, 3000);
        }
        function detenerReintentoEmparejamiento() {
            if (bucleEsperaTimer) { clearInterval(bucleEsperaTimer); bucleEsperaTimer = null; }
        }

        // Recrea mi partida de espera con código NUEVO (misma ficha de cola):
        // limpia cualquier estado corrupto/invisible y me hace "visible" de nuevo.
        // El borrado de la vieja es TRANSACCIONAL y solo procede si sigue sin
        // rival: si el rival entró justo mientras refrescaba, NO la borro y
        // continúo esa partida (antes un remove() a ciegas podía tirarle la
        // partida en la cara al rival que acababa de unirse, y ambos volvían
        // a buscar en un ciclo que no convergía).
        async function recrearMiPartidaEspera() {
            const codViejo = estado.partidaId;
            console.warn('Espera: recreando partida de matchmaking', codViejo || '(sin nodo)');
            mostrarMensaje('Refrescando búsqueda...');
            detenerEscuchaColaRapido();
            cancelarRegistroDesconexion();
            if (codViejo) {
                const mia = await runTransaction(ref(db, 'partidas/' + codViejo), (p) => {
                    if (!p || p.estado !== 'esperando' || p.unido || !p.creador ||
                        p.creador.uid !== estado.usuario.uid) return undefined;
                    return null; // liberada: seguía sin rival
                });
                if (!mia.committed) {
                    // El rival acaba de entrar a MI partida durante el refresco:
                    // quedármela y seguir normalmente (el listener arranca el juego)
                    console.warn('Espera: el rival entró durante el refresco, mantengo la partida', codViejo);
                    await set(ref(db, 'cola_rapido/' + estado.usuario.uid), {
                        uid: estado.usuario.uid,
                        nickname: estado.nickname || 'Jugador',
                        fotoURL: estado.fotoURL || '',
                        partidaId: codViejo,
                        creadoEn: Date.now()
                    }).catch(() => {});
                    estado.partidaId = codViejo;
                    estado.miLado = 'jugador';
                    estado.fase = 'esperando';
                    registrarLimpiezaEspera(codViejo);
                    escucharPartida(codViejo);
                    esperaIniciadaEn = Date.now();
                    return;
                }
            }
            if (estado.usuario) await remove(ref(db, 'cola_rapido/' + estado.usuario.uid)).catch(() => {});
            let codigo = generarCodigoPartida();
            for (let i = 0; i < 10; i++) {
                const s = await get(ref(db, 'partidas/' + codigo));
                if (!s.exists()) break;
                codigo = generarCodigoPartida();
            }
            await set(ref(db, 'partidas/' + codigo), {
                codigo, creador: { uid: estado.usuario.uid, nickname: estado.nickname || 'Jugador', fotoURL: estado.fotoURL || '', listo: true },
                unido: null, estado: 'esperando', rapida: true, creadoEn: Date.now(), ultimaActividad: Date.now()
            });
            await set(ref(db, 'cola_rapido/' + estado.usuario.uid), {
                uid: estado.usuario.uid,
                nickname: estado.nickname || 'Jugador',
                fotoURL: estado.fotoURL || '',
                partidaId: codigo,
                creadoEn: Date.now()
            });
            estado.partidaId = codigo;
            estado.miLado = 'jugador';
            estado.fase = 'esperando';
            registrarLimpiezaEspera(codigo);
            escucharPartida(codigo);
            esperaIniciadaEn = Date.now();
        }

        async function jugarRapido() {
            if (!estado.usuario || buscandoRapido) return;
            buscandoRapido = true;
            mostrarLobbyMensaje('Buscando rival...', false);
            dom.btnJugarRapido.disabled = true;
            dom.btnCrearPartida.disabled = true;
            dom.btnUnirsePartida.disabled = true;
            try {
                // Buscar rivales esperando en la cola de matchmaking
                const colaRef = ref(db, 'cola_rapido');
                const snap = await get(colaRef);
                const candidatos = [];
                if (snap.exists()) {
                    snap.forEach((child) => {
                        const val = child.val();
                        if (val && val.uid && val.uid !== estado.usuario.uid) candidatos.push(child.key);
                    });
                }

                // Unirse al primer candidato que se pueda. intentarUnirseRapido()
                // usa runTransaction: aunque DOS jugadores lean al mismo candidato
                // a la vez, SOLO uno reclama su entrada de la cola y SOLO uno
                // escribe 'unido' en la partida (sin sobrescrituras ni fantasmas).
                let meUni = false;
                for (const key of candidatos) {
                    meUni = await intentarUnirseRapido(key);
                    if (meUni) break;
                }
                if (meUni) { buscandoRapido = false; return; }

                // No hay rival → crear partida y añadirse a la cola
                let codigo = generarCodigoPartida();
                let existe = true;
                let intentos = 0;
                while (existe && intentos < 10) {
                    const s = await get(ref(db, 'partidas/' + codigo));
                    existe = s.exists();
                    if (existe) { codigo = generarCodigoPartida(); intentos++; }
                }
                const partidaRef = ref(db, 'partidas/' + codigo);
                await set(partidaRef, {
                    codigo, creador: { uid: estado.usuario.uid, nickname: estado.nickname || 'Jugador', fotoURL: estado.fotoURL || '', listo: true },
                    unido: null, estado: 'esperando', rapida: true, creadoEn: Date.now(), ultimaActividad: Date.now()
                });
                // Añadir a la cola de matchmaking
                const colaEntry = ref(db, 'cola_rapido/' + estado.usuario.uid);
                await set(colaEntry, {
                    uid: estado.usuario.uid,
                    nickname: estado.nickname || 'Jugador',
                    fotoURL: estado.fotoURL || '',
                    partidaId: codigo,
                    creadoEn: Date.now()
                });

                estado.partidaId = codigo;
                estado.miLado = 'jugador';
                estado.fase = 'esperando';
                estado.esPartidaRapida = true;
                // Si me desconecto durante la búsqueda, borrar partida y cola
                // solos para no dejar una partida fantasma en el matchmaking
                registrarLimpiezaEspera(codigo);
                dom.overlayLobby.classList.add('oculto');
                dom.overlayEsperando.classList.remove('oculto');
                dom.codigoPartida.textContent = codigo;
                dom.esperandoTitulo.textContent = 'Buscando rival...';
                dom.esperandoSubtitulo.textContent = 'Esperando a que otro jugador presione "Jugar rápido"';
                // Ocultar el código porque el emparejamiento es automático
                dom.codigoPartida.style.display = 'none';
                // Habilitar la advertencia de salida mientras se busca rival
                // (antes el primer jugador de la rápida salía sin ningún aviso)
                empujarEstadoEspera();

                // Escuchar la partida: cuando el rival se una, iniciar el juego automáticamente
                escucharPartida(codigo);

                // Escuchar la cola por si otro jugador creó una partida y nos toca unirnos
                if (colaRapidoListener) colaRapidoListener();
                colaRapidoListener = onValue(colaRef, (snap) => {
                    // Si ya entramos en una partida, esta escucha quedó vieja:
                    // soltarla para que un nuevo jugador en la cola no nos saque
                    // de la partida en curso.
                    if (estado.enPartida || estado.fase === 'jugando' || estado.fase === 'fin') {
                        detenerEscuchaColaRapido();
                        return;
                    }
                    if (!snap.exists()) return;
                    snap.forEach((child) => {
                        if (child.key === estado.usuario.uid) return;
                        const val = child.val();
                        if (val && val.partidaId) {
                            // Otro jugador creó una partida → unirme de forma
                            // atómica (transacción): si dos oyentes ven la misma
                            // entrada de la cola, solo uno logra escribir 'unido'.
                            intentarUnirseRapido(child.key).then((ok) => {
                                if (ok && colaRapidoListener) { colaRapidoListener(); colaRapidoListener = null; }
                            });
                        }
                    });
                }, (error) => console.error('Error escuchando cola rápida:', error));

                // Red de seguridad: reintentar el emparejamiento cada pocos
                // segundos mientras espero, pase lo que pase
                iniciarReintentoEmparejamiento();

                buscandoRapido = false;
            } catch (error) {
                console.error('Error en búsqueda rápida:', error);
                // Mostrar el código de error real para diagnosticar
                const codigoError = error && (error.code || error.message || 'desconocido');
                console.error('Código de error Firebase:', codigoError);
                const esPermiso = error && (error.code === 'PERMISSION_DENIED' || (error.message && error.message.toLowerCase().includes('permission')));
                if (esPermiso) {
                    mostrarLobbyMensaje('⚠ Firebase bloquea el acceso. Actualizá las reglas en la consola: agregá el nodo "cola_rapido" (ver SDK Firebase.txt).', true);
                } else {
                    mostrarLobbyMensaje('Error en la búsqueda (' + codigoError + '). Revisá tu conexión e intentá de nuevo.', true);
                }
                dom.btnJugarRapido.disabled = false;
                dom.btnCrearPartida.disabled = false;
                dom.btnUnirsePartida.disabled = false;
                buscandoRapido = false;
            }
        }

        // ============ FIREBASE: ESCUCHAR ============
        let partidaListener = null;
        let ultimoEstadoJuego = null;
        let varYaResolviendo = false;
        let salidaRepentinaRegistrada = false;
        let limpiezaEsperaRegistrada = null;
        // true SOLO cuando el abandono lo inicié YO desde este dispositivo
        // (botón "Salir" o 30 seg con la pestaña oculta). Sirve para distinguir:
        // si el abandono lo inició el RIVAL (mi conexión cayó), es ÉL quien aplica
