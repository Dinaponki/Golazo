        // mi castigo directamente en mis stats, y mi cliente NO debe registrar la
        // derrota otra vez al recibir la partida terminada (evita doble -5).
        let abandonoIniciadoPorMi = false;

        // Suelta la escucha sobre la cola de matchmaking (si quedó activa).
        // Sin esto, el creador de una partida rápida seguía escuchando la cola
        // DENTRO de la partida: si otro jugador entraba a la cola, el listener
        // viejo lo sacaba de su partida en curso para meterlo en la de un extraño.
        function detenerEscuchaColaRapido() {
            if (colaRapidoListener) { colaRapidoListener(); colaRapidoListener = null; }
        }

        // Suelta la escucha sobre MI partida (sin tocar el resto del estado).
        // La usa el matchmaking cuando, siendo anfitrión, voy a abandonar mi
        // propia partida para unirme a la de otro: así el evento de borrado no
        // dispara volverAlLobbyDeEspera() y pisa el nuevo estado.
        function detenerEscuchaPartida() {
            if (partidaListener) { partidaListener(); partidaListener = null; }
            ultimoEstadoJuego = null;
        }

        // Registra (en el servidor) qué lado se desconectó sin cerrar bien la
        // partida. Se aplica POR IGUAL al creador y al que se une: si cualquiera
        // de los dos cierra la pestaña o pierde conexión, el otro recibe
        // 'abandonadoPor' y puede finalizar la partida como abandono.
        function registrarSalidaRepentina() {
            if (!estado.partidaId || !estado.miLado || salidaRepentinaRegistrada) return;
            // Anular primero la limpieza de la etapa de espera (remove de la
            // partida): ya no aplica, ahora marcamos abandono en vez de borrar
            cancelarLimpiezaEspera();
            salidaRepentinaRegistrada = true;
            const partidaRef = ref(db, 'partidas/' + estado.partidaId);
            onDisconnect(partidaRef).update({ abandonadoPor: estado.miLado })
                .catch((e) => console.error('Error registrando salida repentina:', e));
            // Si me desconecto sin cerrar bien la partida, dejar marcado un
            // abandono pendiente en MIS estadísticas online: al volver a
            // index.html se registra la derrota por abandono (-5 pts).
            if (estado.usuario) {
                onDisconnect(ref(db, 'usuarios/' + estado.usuario.uid + '/onlineStats'))
                    .update({ abandonoPendiente: true, abandonoPendienteEn: Date.now() })
                    .catch((e) => console.error('Error registrando abandono pendiente:', e));
            }
            // Además del marcador abandonadoPor, arrancar MI latido y el vigilante
            // del rival: si por cualquier motivo el marcador no llegara (reglas,
            // desconexión silenciosa, etc.), el vigilante termina la partida solo.
            iniciarLatidoYVigilancia();
        }

        // ============ LATIDO (HEARTBEAT) Y VIGILANTE DE RIVAL ============
        // Cada jugador escribe su latido cada 5 segundos mientras está en partida.
        // El vigilante local revisa el último latido conocido DEL RIVAL: si hace
        // más de 30 segundos que no late (pestaña cerrada, app matada, sin red),
        // finaliza el partido automáticamente dando la victoria al que se quedó.
        // Esto GARANTIZA que nadie quede esperando infinitamente, incluso si el
        // marcador abandonadoPor de onDisconnect nunca llegara a escribirse.
        const LATIDO_INTERVALO_MS = 5000;
        const LATIDO_TIMEOUT_MS = 30000;
        let latidoTimer = null;
        let watchdogTimer = null;
        let ultimoLatidoRival = 0;
        let vigilanciaIniciadaEn = 0;

        function iniciarLatidoYVigilancia() {
            detenerLatidoYVigilancia();
            if (!estado.partidaId || !estado.miLado) return;
            ultimoLatidoRival = 0;
            vigilanciaIniciadaEn = Date.now();
            const miBeatRef = ref(db, 'partidas/' + estado.partidaId + '/latidos/' + estado.miLado);
            const latir = () => { set(miBeatRef, Date.now()).catch(() => {}); };
            latir();
            latidoTimer = setInterval(latir, LATIDO_INTERVALO_MS);
            const ladoRivalAbs = estado.miLado === 'jugador' ? 'rival' : 'jugador';
            watchdogTimer = setInterval(() => {
                // Solo actúa en plena partida
                if (!estado.enPartida || estado.fase !== 'jugando' || estado.partidaTerminada) return;
                // Caso A: nunca vimos latir al rival → dar margen de gracia de 60s
                // desde que arrancó la vigilancia y si tampoco apareció, cerrar.
                // Caso B: ya latía pero hace más de 30s que no → cerrar.
                if (!ultimoLatidoRival) {
                    if (Date.now() - vigilanciaIniciadaEn < 60000) return;
                } else if (Date.now() - ultimoLatidoRival <= LATIDO_TIMEOUT_MS) {
                    return;
                }
                console.warn('Vigilante: el rival dejó de responder, cerrando por abandono');
                mostrarMensaje('Tu rival se desconectó');
                finalizarPorAbandonoDelRival(ladoRivalAbs);
            }, 5000);
        }

        function detenerLatidoYVigilancia() {
            if (latidoTimer) { clearInterval(latidoTimer); latidoTimer = null; }
            if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
        }

        // Limpieza de la ETAPA DE ESPERA: si me desconecto mientras busco rival
        // (cerré la pestaña, perdí internet, mataron la app...), Firebase borra
        // solito la partida y mi entrada de la cola. Así NADIE encuentra una
        // partida fantasma en el matchmaking y queda esperando infinitamente.
        function registrarLimpiezaEspera(codigo) {
            try {
                const pRef = ref(db, 'partidas/' + codigo);
                const cRef = estado.usuario ? ref(db, 'cola_rapido/' + estado.usuario.uid) : null;
                onDisconnect(pRef).remove().catch(() => {});
                if (cRef) onDisconnect(cRef).remove().catch(() => {});
                limpiezaEsperaRegistrada = { pRef, cRef };
            } catch (e) { console.error('Error registrando limpieza de espera:', e); }
        }

        function cancelarLimpiezaEspera() {
            if (!limpiezaEsperaRegistrada) return;
            const { pRef, cRef } = limpiezaEsperaRegistrada;
            limpiezaEsperaRegistrada = null;
            try { onDisconnect(pRef).cancel(); } catch (e) { /* noop */ }
            if (cRef) { try { onDisconnect(cRef).cancel(); } catch (e) { /* noop */ } }
        }

        // Cancela TODOS los registros de desconexión (al terminar la partida o
        // salir limpiamente, para que navegar fuera no dispare limpieza vieja)
        function cancelarRegistroDesconexion() {
            if (salidaRepentinaRegistrada && estado.partidaId) {
                salidaRepentinaRegistrada = false;
                try { onDisconnect(ref(db, 'partidas/' + estado.partidaId)).cancel(); } catch (e) { /* noop */ }
            }
            if (estado.usuario) {
                try { onDisconnect(ref(db, 'usuarios/' + estado.usuario.uid + '/onlineStats')).cancel(); } catch (e) { /* noop */ }
            }
            cancelarLimpiezaEspera();
            // Cortar mi latido y el vigilante: la partida ya terminó o salimos
            detenerLatidoYVigilancia();
        }

        // Finaliza la partida porque EL RIVAL abandonó (cerró la pestaña o perdió
        // conexión). Acá se resuelve TODO el cierre automático:
        // 1) Se marca la partida como terminada con ganador = el que se quedó.
        // 2) Se aplica AL INSTANTE el castigo del que abandonó (-5, +1 PJ, +1 PP)
        //    escribiendo directamente sus onlineStats, sin esperar a que vuelva
        //    a entrar. Si las reglas de Firebase bloquearan esa escritura,
        //    queda el respaldo abandonoPendiente (se procesa cuando vuelva).
        // 3) Se muestra la pantalla final de victoria al que se quedó y se le
        //    otorgan +3 pts, +1 partido jugado y +1 partido ganado.
        async function finalizarPorAbandonoDelRival(ladoQueAbandono) {
            if (estado.partidaTerminada || estado.fase === 'fin') return;
            const ganador = ladoQueAbandono === 'jugador' ? 'rival' : 'jugador';
            const gJ = estado.juego.golesJugador, gR = estado.juego.golesRival;
            const resultado = {
                ganador,
                golesJugador: estado.miLado === 'jugador' ? gJ : gR,
                golesRival: estado.miLado === 'jugador' ? gR : gJ,
                abandono: true
            };
            // MOSTRAR LA PANTALLA PRIMERO: el cierre local nunca depende de
            // escrituras a Firebase, así que el que se quedó ve la victoria
            // al instante aunque la red esté caída o una escritura se cuelgue.
            mostrarFinPartido(resultado);
            // Persistir (best effort): marcar terminada en Firebase para que
            // cualquier otro cliente también lo vea...
            try {
                await update(ref(db, 'partidas/' + estado.partidaId), {
                    estado: 'terminada', resultado, ultimaActividad: Date.now()
                });
            } catch (error) { console.error('Error marcando abandono del rival:', error); }
            // ...y aplicar el castigo del abandonador YA (no depende de que vuelva)
            await aplicarPenalizacionAbandono(ladoQueAbandono);
        }

        // Aplica la derrota por abandono al jugador que cerró la pestaña,
        // escribiendo DIRECTAMENTE sus estadísticas online desde este cliente
        // (el que se quedó). Idempotente: el flag penalidadAbandono en la
        // partida impide aplicarla dos veces aunque el listener dispare de nuevo.
        // Si las reglas impiden escribir el nodo ajeno, no se toca nada acá y el
        // abandonoPendiente (ya marcado por su propio onDisconnect) se procesa
        // igual cuando ese jugador vuelva a entrar: nunca hay doble castigo.
        async function aplicarPenalizacionAbandono(ladoQueAbandono) {
            try {
                if (!estado.partidaId) return;
                const partidaRef = ref(db, 'partidas/' + estado.partidaId);
                const snap = await get(partidaRef);
                if (!snap.exists()) return;
                const partida = snap.val();
                // Idempotencia: si ya se aplicó, no volver a restar puntos
                if (partida.penalidadAbandono === true) return;
                // UID del que abandonó según su lado absoluto en la partida
                const infoLado = ladoQueAbandono === 'jugador' ? partida.creador : partida.unido;
                const uidAbandonador = infoLado && infoLado.uid;
                if (!uidAbandonador) return;
                if (estado.usuario && uidAbandonador === estado.usuario.uid) return;

                // 1) Marcar PRIMERO el flag en la partida (si el paso 2 fallara,
                //    el abandonoPendiente sigue armado como respaldo y no hay doble cómputo)
                await update(partidaRef, { penalidadAbandono: true });

                // 2) Escribir la derrota en las stats del que abandonó
                const statsRef = ref(db, 'usuarios/' + uidAbandonador + '/onlineStats');
                const sSnap = await get(statsRef);
                const datos = sSnap.exists() ? sSnap.val() : {};
                if (datos.puntos === undefined && datos.partidosJugados === undefined) {
                    datos.puntos = 0;
                    datos.partidosJugados = 0;
                    datos.partidosGanados = 0;
                    datos.partidosEmpatados = 0;
                    datos.partidosPerdidos = 0;
                    datos.rachaActual = 0;
                    datos.mejorRacha = 0;
                    datos.golesFavor = 0;
                    datos.golesContra = 0;
                    datos.historialPartidos = [];
                }
                const partidosJugados = (datos.partidosJugados || 0) + 1;
                const partidosPerdidos = (datos.partidosPerdidos || 0) + 1;
                const partidosGanados = datos.partidosGanados || 0;
                const efectividad = partidosJugados > 0 ? Math.round((partidosGanados / partidosJugados) * 1000) / 10 : 0;
                const historial = datos.historialPartidos || [];
                historial.push({
                    fecha: Date.now(),
                    resultado: 'perder',
                    golesFavor: 0,
                    golesContra: 0,
                    online: true,
                    abandono: true
                });
                await update(statsRef, {
                    partidosJugados,
                    partidosPerdidos,
                    // Castigo incremental EXACTO: -5 puntos sobre lo acumulado
                    puntos: (datos.puntos || 0) - 5,
                    efectividad,
                    rachaActual: 0,
                    historialPartidos: historial.slice(-200),
                    // Limpiar el pendiente para que verificarAbandono (index.html)
                    // NO vuelva a aplicar otro -5 cuando este jugador vuelva
                    abandonoPendiente: false,
                    ultimaActualizacion: serverTimestamp()
                });
                console.log('Castigo por abandono aplicado al rival:', uidAbandonador, '-5 pts');
            } catch (error) {
                // Escritura bloqueada por reglas o error de red: NO es fatal.
                // El abandonoPendiente del propio cliente del abandonador sigue
                // armado y aplicará el castigo cuando vuelva a entrar.
                console.warn('No se pudo aplicar el castigo directo por abandono (queda el respaldo abandonoPendiente):', error);
            }
        }

        // ============ ADVERTENCIA DE SALIDA ============
        // true si estoy esperando rival (cola de matchmaking o código), todavía
        // sin partida empezada. El PRIMER jugador de una partida rápida pasa por
        // este estado y antes salía SIN ninguna advertencia.
        function estaEsperando() {
            return !!estado.partidaId && !estado.enPartida && estado.fase === 'esperando';
        }

        let esperaPushHecha = false;

        // Muestra el overlay de salida con el mensaje adecuado según el contexto:
        // en plena partida → abandono con pérdida de puntos;
        // buscando rival → cancelación de la búsqueda (con limpieza incluida).
        function mostrarOverlaySalida() {
            if (!dom.salidaMensaje) return;
            if (estaEsperando()) {
                dom.salidaTitulo.innerHTML = '<span class="icono-advertencia">⚠️</span> ¿Salir de la búsqueda?';
                dom.salidaMensaje.innerHTML = 'Estás <span class="destacado-salida">esperando un rival</span> para la partida rápida. Si salís ahora, <span class="destacado-salida">se cancelará la búsqueda</span> y vas a tener que buscar de nuevo.';
                dom.btnConfirmarSalida.textContent = '🚪 Salir';
            } else {
                dom.salidaTitulo.innerHTML = '<span class="icono-advertencia">⚠️</span> ¿Abandonar partida?';
                dom.salidaMensaje.innerHTML = 'Si salís de la partida online, <span class="destacado-salida">se registrará como abandono</span>, tu rival ganará la partida y <span class="destacado-salida">perderás puntos</span> en el ranking online.';
                dom.btnConfirmarSalida.textContent = '🚪 Salir';
            }
            dom.overlaySalida.classList.add('visible');
        }

        // Empuja un estado de historial durante la espera para que el botón
        // "atrás" del navegador dispare el aviso en vez de irse de la página.
        function empujarEstadoEspera() {
            history.pushState({ esperandoRival: true }, '', location.href);
            esperaPushHecha = true;
        }

        function escucharPartida(codigo) {
            if (partidaListener) { partidaListener(); partidaListener = null; }
            const partidaRef = ref(db, 'partidas/' + codigo);
            partidaListener = onValue(partidaRef, (snap) => {
                if (!snap.exists()) {
                    // La partida desapareció de Firebase
                    if (estaEsperando()) {
                        // Estábamos esperando rival y alguien borró la partida
                        // (p.ej. el rival cerró la pestaña y la limpieza
                        // automática la eliminó): volver al lobby, no quedarse
                        // esperando eternamente.
                        mostrarMensaje('La búsqueda fue cancelada');
                        volverAlLobbyDeEspera();
                    } else if (estado.enPartida && !estado.partidaTerminada && estado.fase !== 'fin') {
                        // La partida fue borrada en plena partida: tratarlo como
                        // abandono del rival para que el que quedó no se quede
                        // colgado sin pantalla de fin.
                        finalizarPorAbandonoDelRival(estado.miLado === 'jugador' ? 'rival' : 'jugador');
                    } else {
                        mostrarMensaje('La partida terminó');
                    }
                    return;
                }
                const partida = snap.val();

                // Me uní a una partida cuyo creador murió ANTES de repartir:
                // estado 'jugando', sin 'juego' y sin actividad reciente.
                // Volver al lobby en vez de esperar indefinidamente.
                if (estaEsperando() && partida.estado === 'jugando' && !partida.juego &&
                    (!partida.ultimaActividad || Date.now() - partida.ultimaActividad > 30000)) {
                    mostrarMensaje('El rival no respondió');
                    volverAlLobbyDeEspera();
                    return;
                }
                // Detectar si es una partida rápida (para el ranking online)
                estado.esPartidaRapida = partida.rapida === true;

                // Registrar el último latido conocido DEL RIVAL (lo usa el
                // vigilante para cerrar la partida si el rival desaparece)
                if (estado.miLado && estado.enPartida) {
                    const ladoRivalAbs = estado.miLado === 'jugador' ? 'rival' : 'jugador';
                    const beatRival = ((partida.latidos || {})[ladoRivalAbs]) || 0;
                    if (typeof beatRival === 'number' && beatRival > ultimoLatidoRival) {
                        ultimoLatidoRival = beatRival;
                    }
                }

                // Salida repentina del RIVAL (cerró la pestaña o perdió conexión):
                // vale por igual para el creador y para el que se une después.
                if (partida.estado === 'jugando' && partida.abandonadoPor &&
                    partida.abandonadoPor !== estado.miLado &&
                    !estado.partidaTerminada && estado.fase !== 'fin') {
                    finalizarPorAbandonoDelRival(partida.abandonadoPor);
                }

                // Publicar mis claves de cifrado apenas haya rival (las manos viajan cifradas)
                if (partida.unido && estado.miLado && partida.estado !== 'terminada') {
                    asegurarClavesCifradas().catch((e) => console.error('Error publicando claves:', e));
                }

                // El creador detecta que el rival se unió
                if (estado.miLado === 'jugador' && partida.unido && estado.fase === 'esperando') {
                    estado.fase = 'jugando';
                    estado.enPartida = true;
                    // Limpieza redundante de seguridad: sacar MI entrada de la
                    // cola de matchmaking (el rival ya intentó hacerlo)
                    if (estado.usuario) remove(ref(db, 'cola_rapido/' + estado.usuario.uid)).catch(() => {});
                    dom.overlayEsperando.classList.add('oculto');
                    dom.nombreRivalEtiqueta.textContent = partida.unido.nickname || 'Rival';
                    estado.rivalNombre = partida.unido.nickname || 'Rival';
                    iniciarJuegoOnline();
                }

                if (partida.estado === 'jugando' && partida.juego) {
                    if (estado.fase !== 'jugando') {
                        estado.fase = 'jugando';
                        estado.enPartida = true;
                        dom.overlayEsperando.classList.add('oculto');
                        dom.overlayLobby.classList.add('oculto');
                        dom.nombreJugadorEtiqueta.textContent = estado.nickname || 'Jugador';
                        dom.nombreEnTurno.textContent = estado.nickname || 'Jugador';
                        dom.etiquetaCpu.textContent = 'Turno de ' + estado.rivalNombre;
                        dom.etiquetaJugador.textContent = 'Turno de ' + (estado.nickname || 'Jugador');
                        reproducirAudioFondo();
                        // Empujar un estado de historial para interceptar el botón "atrás"
                        history.pushState({ juegoIniciado: true }, '', location.href);
                        // Ya hay partida en curso: soltar la escucha de la cola y
                        // registrar la salida repentina (simétrico para ambos lados)
                        detenerEscuchaColaRapido();
                        registrarSalidaRepentina();
                    }

                    const j = partida.juego;
                    const jAnterior = ultimoEstadoJuego;
                    ultimoEstadoJuego = j;

                    // Convertir datos absolutos a relativos
                    // Cartas ocultas: la mano propia NUNCA se lee en claro de Firebase
                    // (llega cifrada y se descifra más abajo). Del rival solo se sabe
                    // CUÁNTAS cartas le quedan, nunca cuáles son.
                    const nCartasRival = estado.miLado === 'jugador' ? (j.nCartasRival || 0) : (j.nCartasJugador || 0);
                    estado.juego.manoRival = crearManoFantasma(nCartasRival);
                    estado.juego.golesJugador = estado.miLado === 'jugador' ? (j.golesJugador || 0) : (j.golesRival || 0);
                    estado.juego.golesRival = estado.miLado === 'jugador' ? (j.golesRival || 0) : (j.golesJugador || 0);
                    estado.juego.puntosJugador = estado.miLado === 'jugador' ? (j.puntosJugador || 0) : (j.puntosRival || 0);
                    estado.juego.puntosRival = estado.miLado === 'jugador' ? (j.puntosRival || 0) : (j.puntosJugador || 0);
                    estado.juego.puntosManoJugador = estado.miLado === 'jugador' ? (j.puntosManoJugador || 0) : (j.puntosManoRival || 0);
                    estado.juego.puntosManoRival = estado.miLado === 'jugador' ? (j.puntosManoRival || 0) : (j.puntosManoJugador || 0);
                    estado.juego.manoActual = j.manoActual || 0;
                    estado.juego.rondaActual = j.rondaActual || 0;
                    estado.juego.turnoActual = aRelativo(j.turnoActual);
                    estado.juego.turnoInicial = aRelativo(j.turnoInicial);
                    estado.juego.cartasEnMesa = (j.cartasEnMesa || []).map(c => ({ ...c, origen: aRelativo(c.origen) }));
                    // Convertir fase: 'esperando_rival' absoluto → relativo
                    if (j.fase === 'esperando_rival') {
                        const turnoRelativo = aRelativo(j.turnoActual);
                        estado.juego.fase = turnoRelativo === 'jugador' ? 'esperando_seleccion' : 'esperando_rival';
                    } else {
                        estado.juego.fase = j.fase || 'esperando_seleccion';
                    }
                    estado.juego.cantoActual = j.cantoActual || null;
                    estado.juego.cantoPedidoPor = aRelativo(j.cantoPedidoPor);
                    estado.juego.cantoPendiente = j.cantoPendiente ? { ...j.cantoPendiente, pedidoPor: aRelativo(j.cantoPendiente.pedidoPor) } : null;
                    estado.juego.esperandoRespuestaDe = aRelativo(j.esperandoRespuestaDe);
                    estado.juego.penalUsado = j.penalUsado || false;
                    estado.juego.penalCantadoPor = aRelativo(j.penalCantadoPor);
                    estado.juego.penalActivo = j.penalActivo || false;
                    estado.juego.penalAtacante = aRelativo(j.penalAtacante);
                    estado.juego.penalCartas = (j.penalCartas || []).map(c => ({ ...c, origen: aRelativo(c.origen) }));
                    estado.juego.golUsado = j.golUsado || false;
                    estado.juego.golActivo = j.golActivo || false;
                    estado.juego.golAtacante = aRelativo(j.golAtacante);
                    estado.juego.golCartas = (j.golCartas || []).map(c => ({ ...c, origen: aRelativo(c.origen) }));
                    estado.juego.golazoUsado = j.golazoUsado || false;
                    estado.juego.varPedidoPor = aRelativo(j.varPedidoPor);
                    estado.juego.varTurnoDeclarar = aRelativo(j.varTurnoDeclarar);
                    estado.juego.varPanelVisible = j.varPanelVisible || false;
                    if (j.varDeclaraciones) {
                        estado.juego.varDeclaraciones = {
                            jugador: estado.miLado === 'jugador' ? j.varDeclaraciones.jugador : j.varDeclaraciones.rival,
                            rival: estado.miLado === 'jugador' ? j.varDeclaraciones.rival : j.varDeclaraciones.jugador
                        };
                    }
                    estado.juego.golEnMano = j.golEnMano || false;
                    estado.juego.ganadorManoAnterior = aRelativo(j.ganadorManoAnterior);
                    estado.juego.inicioRonda = j.inicioRonda || 0;
                    estado.juego.historialManos = (j.historialManos || []).map(h => ({
                        ...h,
                        turnoInicial: aRelativo(h.turnoInicial),
                        golesJugador: estado.miLado === 'jugador' ? h.golesJugador : h.golesRival,
                        golesRival: estado.miLado === 'jugador' ? h.golesRival : h.golesJugador,
                        puntosJugador: estado.miLado === 'jugador' ? h.puntosJugador : h.puntosRival,
                        puntosRival: estado.miLado === 'jugador' ? h.puntosRival : h.puntosJugador,
                    }));
                    estado.juego.golesInicioManoJugador = estado.miLado === 'jugador' ? (j.golesInicioManoJugador || 0) : (j.golesInicioManoRival || 0);
                    estado.juego.golesInicioManoRival = estado.miLado === 'jugador' ? (j.golesInicioManoRival || 0) : (j.golesInicioManoJugador || 0);

                    // Descifrar la mano propia si llegó una versión nueva cifrada
                    // (incluye el "regalo" del reparto inicial, que solo yo puedo abrir)
                    if (j.manos && j.manos[estado.miLado]) intentarDescifrarManoRemota(j.manos[estado.miLado]);

                    // ============ REPRODUCIR SONIDOS DEL RIVAL ============
                    if (jAnterior) {
                        // Sonido de carta del rival
                        const cartasAnteriores = (jAnterior.cartasEnMesa || []).length;
                        const cartasActuales = (j.cartasEnMesa || []).length;
                        if (cartasActuales > cartasAnteriores) {
                            const nuevasCartas = (j.cartasEnMesa || []).slice(cartasAnteriores);
                            for (const nc of nuevasCartas) {
                                const origenRel = aRelativo(nc.origen);
                                if (origenRel === 'rival') {
                                    reproducirSonido('carta');
                                }
                            }
                        }
                        // Sonido de penal del rival
                        if (!jAnterior.penalCantadoPor && j.penalCantadoPor) {
                            const quienPenal = aRelativo(j.penalCantadoPor);
                            if (quienPenal === 'rival') {
                                reproducirSonido('penalcpu');
                                mostrarMensaje(`🥅 PENAL de ${estado.rivalNombre}`);
                            }
                        }
                        // Sonido de gol del rival
                        if (!jAnterior.golUsado && j.golUsado) {
                            // Quien pidió gol es cantoPedidoPor
                            if (j.cantoPedidoPor) {
                                const quienGol = aRelativo(j.cantoPedidoPor);
                                if (quienGol === 'rival') {
                                    reproducirSonido('golcpucanto');
                                    mostrarMensaje(`⚽ ¡GOL! de ${estado.rivalNombre}`);
                                }
                            }
                        }
                        // Sonido de golazo del rival
                        if (!jAnterior.golazoUsado && j.golazoUsado) {
                            if (j.cantoPedidoPor) {
                                const quienGolazo = aRelativo(j.cantoPedidoPor);
                                if (quienGolazo === 'rival') reproducirSonido('golazocpu');
                            }
                        }
                        // Sonido de quiero/noquiero del rival
                        if (jAnterior.esperandoRespuestaDe && !j.esperandoRespuestaDe) {
                            // El rival respondió
                            if (j.fase === 'penal_pedido' || j.fase === 'gol_pedido' || j.fase === 'golazo_pedido' || j.fase === 'var_decision') {
                                // El rival respondió algo, pero no sabemos qué exactamente
                                // Solo reproducimos si el que respondió fue el rival
                            }
                        }
                        // Sonido de VAR del rival
                        if (!jAnterior.varPedidoPor && j.varPedidoPor) {
                            const quienVar = aRelativo(j.varPedidoPor);
                            if (quienVar === 'rival') {
                                reproducirSonido('pidoverelvarcpu');
                                mostrarMensaje(`📺 ${estado.rivalNombre} pide VAR`);
                            }
                        }
                        // ============ MENSAJES DE RESPUESTAS DEL RIVAL ============
                        // Detectar qué respondió el rival a un canto (quiero / no quiero / VAR / golazo)
                        // IMPORTANTE: se convierte a lado relativo con aRelativo() para que cada
                        // cliente solo detecte las respuestas del OPONENTE. Sin esta conversión,
                        // el jugador unido (lado absoluto 'rival') detectaba su propia respuesta
                        // reflejada desde Firebase y se escuchaban las dos voces.
                        if (aRelativo(jAnterior.esperandoRespuestaDe) === 'rival' && aRelativo(j.esperandoRespuestaDe) !== 'rival') {
                            if (!jAnterior.golazoUsado && j.golazoUsado) {
                                mostrarMensaje(`💥 ${estado.rivalNombre} canta GOLAZO`);
                            } else if (!jAnterior.varPedidoPor && j.varPedidoPor) {
                                // Ya se muestra el mensaje de "pide VAR" arriba
                            } else if (j.fase === 'var_pedido' || j.penalActivo || j.golActivo || j.cantoPendiente) {
                                reproducirSonido('quierocpu');
                                mostrarMensaje(`${estado.rivalNombre}: ✓ ¡Quiero!`);
                            } else {
                                reproducirSonido('noquierocpu');
                                mostrarMensaje(`${estado.rivalNombre}: ✗ No quiso`);
                            }
                        }
                        // Sonido de gol del rival (cuando se marca un gol)
                        if (jAnterior.golesJugador !== undefined && j.golesJugador !== undefined) {
                            const golesJugadorAntes = estado.miLado === 'jugador' ? jAnterior.golesJugador : jAnterior.golesRival;
                            const golesJugadorAhora = estado.miLado === 'jugador' ? j.golesJugador : j.golesRival;
                            if (golesJugadorAhora > golesJugadorAntes) {
                                // Yo metí gol
                            }
                            const golesRivalAntes = estado.miLado === 'jugador' ? jAnterior.golesRival : jAnterior.golesJugador;
                            const golesRivalAhora = estado.miLado === 'jugador' ? j.golesRival : j.golesJugador;
                            if (golesRivalAhora > golesRivalAntes) {
                                reproducirSonido('golcpu');
                            }
                        }
                        // Sonido de punto del rival
                        if (jAnterior.puntosJugador !== undefined && j.puntosJugador !== undefined) {
                            const puntosRivalAntes = estado.miLado === 'jugador' ? jAnterior.puntosRival : jAnterior.puntosJugador;
                            const puntosRivalAhora = estado.miLado === 'jugador' ? j.puntosRival : j.puntosJugador;
                            if (puntosRivalAhora > puntosRivalAntes) {
                                reproducirSonido('puntocpu');
                            }
                        }
                    }

                    // ============ VAR: PANEL VISIBLE SINCRONIZADO ============
                    // Mostrar/ocultar el panel VAR según el estado sincronizado
                    if (dom.varPanel) {
                        if (estado.juego.varPanelVisible) {
                            dom.varPanel.classList.add('visible');
                        } else {
                            dom.varPanel.classList.remove('visible');
                        }
                    }

                    // ============ VAR: DECLARACIÓN Y RESOLUCIÓN AUTOMÁTICA ============
                    // Si estamos en fase var_pedido
                    if (estado.juego.fase === 'var_pedido' && !varYaResolviendo) {
                        const miDeclare = estado.juego.varDeclaraciones.jugador;
                        const rivalDeclare = estado.juego.varDeclaraciones.rival;
                        // Actualizar el panel VAR con las declaraciones actuales
                        if (dom.varPanel && dom.varPanelTexto) {
                            const dj = miDeclare === null || miDeclare === undefined ? '?' : miDeclare;
                            const dr = rivalDeclare === null || rivalDeclare === undefined ? '?' : rivalDeclare;
                            dom.varPanelTexto.textContent = `${estado.nickname || 'Jugador'} ${dj} vs ${estado.rivalNombre} ${dr}`;
                            dom.varPanel.classList.add('visible');
                        }
                        // Si yo aún no declaré, declaro automáticamente
                        if (miDeclare === null || miDeclare === undefined) {
                            varYaResolviendo = true;
                            declararVarJugador();
                            varYaResolviendo = false;
                        } else if (rivalDeclare !== null && rivalDeclare !== undefined) {
                            // Ambos ya declaramos → solo el declarante resuelve
                            if (estado.juego.varTurnoDeclarar === 'jugador') {
                                varYaResolviendo = true;
                                verificarVarResolucion();
                                varYaResolviendo = false;
                            }
                        }
                    }

                    renderizarTodo();
                }

                if (partida.estado === 'terminada' && partida.resultado) {
                    mostrarFinPartido(partida.resultado);
                }
            }, (error) => console.error('Error escuchando partida:', error));
        }

        // ============ INICIAR JUEGO ============
        async function iniciarJuegoOnline() {
            estado.fase = 'jugando';
            estado.enPartida = true;
            // Regístrame en el servidor por si cierro la pestaña SIN terminar la
            // partida. Esto es CLAVE para el CREADOR: el listener de Firebase solo
            // registra la salida repentina dentro del bloque `estado.fase !==
            // 'jugando'`, pero el creador llega al nodo 'juego' con fase YA en
            // 'jugando' (la seteó esta misma función) y ese bloque se lo salta.
            // Sin este llamado, si el creador salía a mitad de partida se borraba
            // la partida (por la limpieza de espera aún activa) y nunca quedaba
            // marcado su abandonoPendiente → no se le restaban los 5 puntos.
            registrarSalidaRepentina();
            dom.nombreJugadorEtiqueta.textContent = estado.nickname || 'Jugador';
            dom.nombreEnTurno.textContent = estado.nickname || 'Jugador';
            dom.etiquetaCpu.textContent = 'Turno de ' + estado.rivalNombre;
            dom.etiquetaJugador.textContent = 'Turno de ' + (estado.nickname || 'Jugador');

            // El creador reparte las cartas. Cada mano viaja CIFRADA: la propia con
            // mi clave local, la del rival como regalo que solo él puede abrir.
            if (estado.miLado === 'jugador') {
                const mazo = mezclarMazo(crearMazo());
                const { manoJ, manoR } = repartir(mazo);
                const manoJugadorOrdenada = ordenarMano(manoJ);
                const manoRivalOrdenada = ordenarMano(manoR);
                const partidaRef = ref(db, 'partidas/' + estado.partidaId);
                await update(partidaRef, {
                    juego: {
                        nCartasJugador: CARTAS_POR_JUGADOR, nCartasRival: CARTAS_POR_JUGADOR,
                        golesJugador: 0, golesRival: 0,
                        puntosJugador: 0, puntosRival: 0,
                        puntosManoJugador: 0, puntosManoRival: 0,
                        manoActual: 0, rondaActual: 0,
                        turnoInicial: 'jugador', turnoActual: 'jugador',
                        cartasEnMesa: [], fase: 'esperando_seleccion',
                        penalUsado: false, penalCantadoPor: null,
                        penalActivo: false, penalAtacante: null, penalCartas: [],
                        golActivo: false, golAtacante: null, golCartas: [],
                        golUsado: false, golazoUsado: false,
                        cantoActual: null, cantoPedidoPor: null, cantoPendiente: null,
                        varPedidoPor: null,
                        varDeclaraciones: { jugador: null, rival: null },
                        varTurnoDeclarar: null, esperandoRespuestaDe: null,
                        historialManos: [], inicioRonda: 0,
                        ganadorManoAnterior: null, golEnMano: false,
                        golesInicioManoJugador: 0, golesInicioManoRival: 0,
                    },
                    ultimaActividad: Date.now()
                });
                try {
                    const manosCifradas = await cifrarAmbasManos(manoJugadorOrdenada, manoRivalOrdenada);
                    await update(ref(db, 'partidas/' + estado.partidaId + '/juego'), manosCifradas);
                } catch (error) {
                    console.error('Error cifrando manos:', error);
                    mostrarMensaje('⚠ No se pudieron cifrar las manos');
                }
                estado.juego.manoJugador = manoJugadorOrdenada;
                estado.juego.manoRival = crearManoFantasma(CARTAS_POR_JUGADOR);
                estado.juego.turnoActual = 'jugador';
                estado.juego.fase = 'esperando_seleccion';
            }

            reproducirAudioFondo();
            renderizarTodo();
            mostrarMensaje('¡Partida comenzada!');
        }

        // ============ RESOLUCIÓN DE RONDA ============
        function cartasDeRondaActual() {
            return estado.juego.cartasEnMesa.slice(estado.juego.inicioRonda || 0);
        }

        function rivalJugoEstaRonda() {
            return cartasDeRondaActual().some(c => c.origen === 'rival');
        }

        function jugadorJugoEstaRonda() {
            return cartasDeRondaActual().some(c => c.origen === 'jugador');
        }

        function alguienSinCartas() {
            return estado.juego.manoJugador.length === 0 || estado.juego.manoRival.length === 0;
        }

        function resolverRonda() {
            if (estado.juego.penalActivo) { resolverPenal(); return; }
            if (estado.juego.golActivo) { resolverGol(); return; }

            const cartasRonda = cartasDeRondaActual();
            const uj = cartasRonda.filter(c => c.origen === 'jugador').pop();
            const ur = cartasRonda.filter(c => c.origen === 'rival').pop();
            if (!uj || !ur) return;

            if (uj.carta.numero > ur.carta.numero) {
                estado.juego.puntosJugador++;
                estado.juego.turnoInicial = 'jugador';
                mostrarMensaje('¡Ganaste la ronda!');
                reproducirSonido('puntoplayer');
            } else if (ur.carta.numero > uj.carta.numero) {
                estado.juego.puntosRival++;
                estado.juego.turnoInicial = 'rival';
                mostrarMensaje(estado.rivalNombre + ' gana la ronda');
                reproducirSonido('puntocpu');
            } else {
                mostrarMensaje('Empate');
            }
            estado.juego.rondaActual++;
            renderizarMarcador();
            renderizarTodo();

            if (verificarGolPorPuntos()) {
                sincronizarJuego();
                setTimeout(() => finalizarMano(), 2200);
                return;
            }

            if (estado.juego.cantoPendiente) {
                const pendiente = estado.juego.cantoPendiente;
                estado.juego.cantoPendiente = null;
                sincronizarJuego();
                setTimeout(() => iniciarEjecucionCanto(pendiente.tipo, pendiente.pedidoPor), 800);
                return;
            }

            sincronizarJuego();
            setTimeout(continuarFlujo, 800);
        }

        function resolverPenal() {
            const cartasPenal = estado.juego.penalCartas;
            const uj = cartasPenal.filter(c => c.origen === 'jugador').pop();
            const ur = cartasPenal.filter(c => c.origen === 'rival').pop();
            if (!uj || !ur) {
                estado.juego.penalActivo = false;
                estado.juego.penalAtacante = null;
                estado.juego.penalCartas = [];
                finalizarCanto();
                return;
            }
            const atacanteEsJugador = estado.juego.penalAtacante === 'jugador';
            const cartaAtacante = atacanteEsJugador ? uj : ur;
            const cartaDefensor = atacanteEsJugador ? ur : uj;
            const atacanteJugoDel = cartaAtacante.carta.posicion === 'Del';
            const defensorJugoArq = cartaDefensor.carta.posicion === 'Arq';
            const quienAtaca = estado.juego.penalAtacante;
            estado.juego.penalActivo = false;
            estado.juego.penalAtacante = null;
            estado.juego.penalCartas = [];

            if (!atacanteJugoDel) {
                const golPorPuntos = sumarPuntos(atacanteEsJugador ? 'rival' : 'jugador', 2);
                mostrarMensaje('Atacante sin delantero - +2 defensor');
                if (golPorPuntos) setTimeout(finalizarMano, 2200);
                else finalizarCanto();
            } else if (!defensorJugoArq) {
                convertirGol(quienAtaca);
                mostrarMensaje('⚽ ¡GOL! Defensor sin arquero');
                if (estado.juego.golEnMano) setTimeout(finalizarMano, 2200);
                else finalizarCanto();
            } else {
                if (cartaAtacante.carta.numero > cartaDefensor.carta.numero) {
                    convertirGol(quienAtaca);
                    mostrarMensaje('⚽ ¡GOL! Penal exitoso');
                } else {
                    sumarPuntos(atacanteEsJugador ? 'rival' : 'jugador', 2);
                    mostrarMensaje('Arquero ataja el penal');
                }
                if (estado.juego.golEnMano) setTimeout(finalizarMano, 2200);
                else finalizarCanto();
            }
        }

        function resolverGol() {
            const cartasGol = estado.juego.golCartas;
            const uj = cartasGol.filter(c => c.origen === 'jugador').pop();
            const ur = cartasGol.filter(c => c.origen === 'rival').pop();
            if (!uj || !ur) return;
            const atacanteEsJugador = estado.juego.golAtacante === 'jugador';
            const cartaAtacante = atacanteEsJugador ? uj : ur;
            const cartaDefensor = atacanteEsJugador ? ur : uj;
            const atacanteJugoDel = cartaAtacante.carta.posicion === 'Del';
            const defensorJugoArqDef = cartaDefensor.carta.posicion === 'Arq' || cartaDefensor.carta.posicion === 'Def';
            const quienAtaca = estado.juego.golAtacante;
            estado.juego.golActivo = false;
            estado.juego.golAtacante = null;
            estado.juego.golCartas = [];

            if (!atacanteJugoDel) {
                convertirGol(atacanteEsJugador ? 'rival' : 'jugador');
                mostrarMensaje('⚽ ¡GOL! Atacante sin delantero');
                setTimeout(finalizarMano, 2200);
                return;
            }
            if (!defensorJugoArqDef) {
                convertirGol(quienAtaca);
                mostrarMensaje('⚽ ¡GOL! Sin defensor');
                setTimeout(finalizarMano, 2200);
                return;
            }
            if (cartaAtacante.carta.numero > cartaDefensor.carta.numero) {
                convertirGol(quienAtaca);
                mostrarMensaje('⚽ ¡GOL!');
                setTimeout(finalizarMano, 2200);
            } else {
                const quienDefiende = atacanteEsJugador ? 'rival' : 'jugador';
                convertirGol(quienDefiende);
                mostrarMensaje('⚽ ¡GOL! Defendido');
                setTimeout(finalizarMano, 2200);
            }
        }

        function verificarGolPorPuntos() {
            if (estado.juego.golEnMano) return false;
            let gol = false;
            if (estado.juego.puntosJugador >= PUNTOS_PARA_GOL) {
                estado.juego.golesJugador++;
                estado.juego.puntosManoJugador += estado.juego.puntosJugador;
                estado.juego.puntosManoRival += estado.juego.puntosRival;
                estado.juego.puntosJugador = 0;
                estado.juego.puntosRival = 0;
                estado.juego.golEnMano = true;
                estado.juego.ganadorManoAnterior = 'jugador';
                mostrarMensaje('⚽ ¡GOL DE ' + (estado.nickname || 'Jugador').toUpperCase() + '!');
                reproducirSonido('golplayer');
                gol = true;
            }
            if (estado.juego.puntosRival >= PUNTOS_PARA_GOL) {
                estado.juego.golesRival++;
                estado.juego.puntosManoJugador += estado.juego.puntosJugador;
                estado.juego.puntosManoRival += estado.juego.puntosRival;
                estado.juego.puntosRival = 0;
                estado.juego.puntosJugador = 0;
                estado.juego.golEnMano = true;
                estado.juego.ganadorManoAnterior = 'rival';
                mostrarMensaje('⚽ Gol de ' + estado.rivalNombre);
                reproducirSonido('golcpu');
                gol = true;
            }
            if (gol) { renderizarMarcador(); renderizarTodo(); }
            return gol;
        }

        function sumarPuntos(quien, cant) {
            let gol = false;
            for (let i = 0; i < cant; i++) {
                if (quien === 'jugador') {
                    estado.juego.puntosJugador++;
                    if (estado.juego.puntosJugador >= PUNTOS_PARA_GOL) {
                        estado.juego.golesJugador++;
                        estado.juego.puntosManoJugador += estado.juego.puntosJugador;
                        estado.juego.puntosManoRival += estado.juego.puntosRival;
                        estado.juego.puntosJugador = 0;
                        estado.juego.puntosRival = 0;
                        estado.juego.golEnMano = true;
                        estado.juego.ganadorManoAnterior = 'jugador';
                        mostrarMensaje('⚽ ¡GOL DE ' + (estado.nickname || 'Jugador').toUpperCase() + '!');
                        reproducirSonido('golplayer');
                        gol = true;
                    } else { reproducirSonido('puntoplayer'); }
                } else {
                    estado.juego.puntosRival++;
                    if (estado.juego.puntosRival >= PUNTOS_PARA_GOL) {
                        estado.juego.golesRival++;
                        estado.juego.puntosManoJugador += estado.juego.puntosJugador;
                        estado.juego.puntosManoRival += estado.juego.puntosRival;
                        estado.juego.puntosRival = 0;
                        estado.juego.puntosJugador = 0;
                        estado.juego.golEnMano = true;
                        estado.juego.ganadorManoAnterior = 'rival';
                        mostrarMensaje('⚽ Gol de ' + estado.rivalNombre);
                        reproducirSonido('golcpu');
                        gol = true;
                    } else { reproducirSonido('puntocpu'); }
                }
            }
            renderizarMarcador();
            return gol;
        }

        function convertirGol(quien) {
            if (quien === 'jugador') { estado.juego.golesJugador++; reproducirSonido('golplayer'); }
            else { estado.juego.golesRival++; reproducirSonido('golcpu'); }
            estado.juego.puntosManoJugador += estado.juego.puntosJugador;
            estado.juego.puntosManoRival += estado.juego.puntosRival;
            estado.juego.puntosJugador = 0;
            estado.juego.puntosRival = 0;
            estado.juego.golEnMano = true;
            estado.juego.ganadorManoAnterior = quien;
            renderizarMarcador();
        }

        function continuarFlujo() {
            if (verificarGolPorPuntos()) { sincronizarJuego(); setTimeout(() => finalizarMano(), 2200); return; }
            if (alguienSinCartas() || estado.juego.rondaActual >= 4) { sincronizarJuego(); setTimeout(finalizarMano, 1000); return; }
            estado.juego.turnoActual = estado.juego.turnoInicial;
            estado.juego.fase = 'esperando_seleccion';
            estado.juego.cartaSeleccionada = null;
            estado.juego.inicioRonda = estado.juego.cartasEnMesa.length;
            sincronizarJuego();
            renderizarTodo();
        }

        async function finalizarMano() {
            // Ocultar el panel VAR al finalizar la mano (sincronizado para ambos)
            estado.juego.varPanelVisible = false;
            if (dom.varPanel) dom.varPanel.classList.remove('visible');
            const golesManoJ = estado.juego.golesJugador - estado.juego.golesInicioManoJugador;
            const golesManoR = estado.juego.golesRival - estado.juego.golesInicioManoRival;
            estado.juego.puntosManoJugador += estado.juego.puntosJugador;
            estado.juego.puntosManoRival += estado.juego.puntosRival;
            estado.juego.historialManos.push({
                minuto: MINUTOS[estado.juego.manoActual],
                golesJugador: golesManoJ, golesRival: golesManoR,
                puntosJugador: estado.juego.puntosManoJugador,
                puntosRival: estado.juego.puntosManoRival,
                turnoInicial: estado.juego.turnoInicial,
            });
            estado.juego.manoActual++;
            if (estado.juego.manoActual >= TOTAL_MANOS) {
                estado.juego.fase = 'fin_partido';
                const gJ = estado.juego.golesJugador;
                const gR = estado.juego.golesRival;
                const ganadorRel = gJ > gR ? 'jugador' : (gR > gJ ? 'rival' : 'empate');
                // Convertir a absoluto para Firebase
                const ganador = ganadorRel === 'empate' ? 'empate' : aAbsoluto(ganadorRel);
                const golesJugadorAbs = estado.miLado === 'jugador' ? gJ : gR;
                const golesRivalAbs = estado.miLado === 'jugador' ? gR : gJ;
                const resultado = { ganador, golesJugador: golesJugadorAbs, golesRival: golesRivalAbs, abandono: false };
                try {
                    const partidaRef = ref(db, 'partidas/' + estado.partidaId);
                    await update(partidaRef, {
                        estado: 'terminada',
                        resultado,
                        ultimaActividad: Date.now()
                    });
                } catch (error) { console.error('Error finalizando partida:', error); }
                sincronizarJuego();
                renderizarTodo();
                setTimeout(() => mostrarFinPartido(resultado), 600);
                return;
            }
            iniciarNuevaMano();
        }

        async function iniciarNuevaMano() {
            const nuevoTurnoInicial = estado.juego.ganadorManoAnterior || estado.juego.turnoInicial;
            estado.juego.golesInicioManoJugador = estado.juego.golesJugador;
            estado.juego.golesInicioManoRival = estado.juego.golesRival;
            estado.juego.golEnMano = false;
            estado.juego.puntosJugador = 0;
            estado.juego.puntosRival = 0;
            estado.juego.puntosManoJugador = 0;
            estado.juego.puntosManoRival = 0;
            estado.juego.rondaActual = 0;
            estado.juego.cartasEnMesa = [];
            estado.juego.inicioRonda = 0;
            estado.juego.cartaSeleccionada = null;
            estado.juego.penalUsado = false;
            estado.juego.penalCantadoPor = null;
            estado.juego.penalActivo = false;
            estado.juego.penalAtacante = null;
            estado.juego.penalCartas = [];
            estado.juego.golActivo = false;
            estado.juego.golAtacante = null;
            estado.juego.golCartas = [];
            estado.juego.golUsado = false;
            estado.juego.golazoUsado = false;
            estado.juego.cantoActual = null;
            estado.juego.cantoPedidoPor = null;
            estado.juego.cantoPendiente = null;
            estado.juego.esperandoRespuestaDe = null;
            estado.juego.varDeclaraciones = { jugador: null, rival: null };
            estado.juego.varPedidoPor = null;
            estado.juego.varPanelVisible = false;
            estado.juego.ganadorManoAnterior = null;
            if (dom.varPanel) dom.varPanel.classList.remove('visible');

            const mazo = mezclarMazo(crearMazo());
            const { manoJ, manoR } = repartir(mazo);
            estado.juego.manoJugador = ordenarMano(manoJ);
            estado.juego.manoRival = crearManoFantasma(manoR.length);
            estado.juego.turnoInicial = nuevoTurnoInicial;
            estado.juego.turnoActual = estado.juego.turnoInicial;
            estado.juego.fase = 'esperando_seleccion';
            try {
                // Ambas manos cifradas: la mía con mi clave, la del rival como regalo
                sincronizarJuego(await cifrarAmbasManos(estado.juego.manoJugador, ordenarMano(manoR)));
            } catch (error) {
                console.error('Error cifrando nueva mano:', error);
                sincronizarJuego();
            }
            renderizarTodo();
        }

        // ============ CANTOS ============
        function jugadorPidePenal() {
            if (estado.fase !== 'jugando') return;
            if (estado.juego.fase !== 'esperando_seleccion') return;
            if (estado.juego.rondaActual !== 0) return;
            if (estado.juego.penalUsado || estado.juego.penalCantadoPor) return;
            if (estado.juego.turnoActual !== 'jugador') return;

            estado.juego.fase = 'penal_pedido';
            estado.juego.cantoActual = 'penal';
            estado.juego.cantoPedidoPor = 'jugador';
            estado.juego.esperandoRespuestaDe = 'rival';
            estado.juego.penalUsado = true;
            estado.juego.penalCantadoPor = 'jugador';
            sincronizarJuego();
            renderizarTodo();
            reproducirSonido('penaljugador');
            mostrarMensaje(`🥅 PENAL de ${estado.nickname || 'Jugador'}`);
        }

        function jugadorPideGol() {
            if (estado.fase !== 'jugando') return;
            if (estado.juego.fase !== 'esperando_seleccion') return;
            if (estado.juego.rondaActual < 1) return;
            if (estado.juego.golUsado) return;
            if (estado.juego.manoJugador.length === 0 || estado.juego.manoRival.length === 0) return;
            if (estado.juego.turnoActual !== 'jugador') return;

            estado.juego.fase = 'gol_pedido';
            estado.juego.cantoActual = 'gol';
            estado.juego.cantoPedidoPor = 'jugador';
            estado.juego.esperandoRespuestaDe = 'rival';
            estado.juego.golUsado = true;
            sincronizarJuego();
            renderizarTodo();
            reproducirSonido('goljugador');
            mostrarMensaje(`⚽ ¡GOL! de ${estado.nickname || 'Jugador'}`);
        }

        function jugadorRespondeQuiero() {
            if (estado.juego.esperandoRespuestaDe !== 'jugador') return;
            procesarRespuestaJugador('quiero');
        }

        function jugadorRespondeNoQuiero() {
            if (estado.juego.esperandoRespuestaDe !== 'jugador') return;
            procesarRespuestaJugador('no_quiero');
        }

        function jugadorRespondeVar() {
            if (estado.juego.esperandoRespuestaDe !== 'jugador') return;
            if (estado.juego.cantoActual !== 'penal') return;
            procesarRespuestaJugador('var');
        }

        function jugadorRespondeGolazo() {
            if (estado.juego.esperandoRespuestaDe !== 'jugador') return;
            if (estado.juego.cantoActual !== 'gol') return;
            procesarRespuestaJugador('golazo');
        }

        function procesarRespuestaJugador(resp) {
                if (estado.juego.fase === 'var_decision') {
                    if (resp === 'no_quiero') {
                        sumarPuntos(estado.juego.varPedidoPor, 1);
                        reproducirSonido('noquierojugador');
                        mostrarMensaje(`${estado.nickname || 'Jugador'}: ✗ No quiero el VAR`);
                        finalizarCanto();
                    } else {
                        reproducirSonido('quierojugador');
                        mostrarMensaje(`${estado.nickname || 'Jugador'}: ✓ ¡Quiero el VAR!`);
                        iniciarVar();
                    }
                    return;
                }

            const { cantoActual, cantoPedidoPor } = estado.juego;
            if (resp === 'no_quiero') {
                const quienCanto = cantoPedidoPor;
                const puntos = cantoActual === 'golazo' ? 2 : 1;
                const golPorPuntos = sumarPuntos(quienCanto, puntos);
                reproducirSonido('noquierojugador');
                mostrarMensaje(`${estado.nickname || 'Jugador'}: ✗ No quiso`);
                if (golPorPuntos) setTimeout(finalizarMano, 2200);
                else finalizarCanto();
            } else if (resp === 'var') {
                estado.juego.fase = 'var_decision';
                estado.juego.varPedidoPor = 'jugador';
                estado.juego.esperandoRespuestaDe = 'rival';
                sincronizarJuego();
                renderizarTodo();
                reproducirSonido('varjugador');
                mostrarMensaje(`📺 ${estado.nickname || 'Jugador'} pide VAR`);
            } else if (resp === 'golazo') {
                estado.juego.fase = 'golazo_pedido';
                estado.juego.cantoActual = 'golazo';
                estado.juego.cantoPedidoPor = 'jugador';
                estado.juego.esperandoRespuestaDe = 'rival';
                estado.juego.golazoUsado = true;
                sincronizarJuego();
                renderizarTodo();
                reproducirSonido('golazojugador');
                mostrarMensaje(`💥 ${estado.nickname || 'Jugador'} canta GOLAZO`);
            } else if (resp === 'quiero') {
                reproducirSonido('quierojugador');
                mostrarMensaje(`${estado.nickname || 'Jugador'}: ✓ ¡Quiero!`);
                ejecutarCanto(cantoActual, cantoPedidoPor);
            }
        }

        function ejecutarCanto(tipo, pedidoPor) {
            const jugadorJugo = jugadorJugoEstaRonda();
            const rivalJugo = rivalJugoEstaRonda();

            if (jugadorJugo && !rivalJugo) {
                estado.juego.fase = 'esperando_rival';
                estado.juego.turnoActual = 'rival';
                estado.juego.cantoPendiente = { tipo, pedidoPor };
                sincronizarJuego();
                renderizarTodo();
                return;
            }
            if (rivalJugo && !jugadorJugo) {
                estado.juego.turnoActual = 'jugador';
                estado.juego.fase = 'esperando_seleccion';
                estado.juego.cartaSeleccionada = null;
                estado.juego.cantoPendiente = { tipo, pedidoPor };
                sincronizarJuego();
                renderizarTodo();
                return;
            }
            iniciarEjecucionCanto(tipo, pedidoPor);
        }

        function iniciarEjecucionCanto(tipo, pedidoPor) {
            estado.juego.esperandoRespuestaDe = null;
            estado.juego.cantoActual = null;
            estado.juego.cantoPedidoPor = null;

            if (tipo === 'penal') {
                estado.juego.penalActivo = true;
                estado.juego.penalAtacante = pedidoPor;
                estado.juego.penalCartas = [];
                if (estado.juego.turnoInicial === 'rival') {
                    estado.juego.fase = 'esperando_rival';
                    estado.juego.turnoActual = 'rival';
                } else {
                    estado.juego.fase = 'esperando_seleccion';
                    estado.juego.turnoActual = 'jugador';
                    estado.juego.cartaSeleccionada = null;
                }
                sincronizarJuego();
                renderizarTodo();
                mostrarMensaje(`🥅 ¡PENAL de ${pedidoPor === 'jugador' ? (estado.nickname || 'Jugador') : estado.rivalNombre}!`);
                return;
            }
            estado.juego.golActivo = true;
            estado.juego.golAtacante = pedidoPor;
            estado.juego.golCartas = [];
            if (estado.juego.turnoInicial === 'rival') {
                estado.juego.fase = 'esperando_rival';
                estado.juego.turnoActual = 'rival';
            } else {
                estado.juego.fase = 'esperando_seleccion';
                estado.juego.turnoActual = 'jugador';
                estado.juego.cartaSeleccionada = null;
            }
            sincronizarJuego();
            renderizarTodo();
            const nombreAtacante = pedidoPor === 'jugador' ? (estado.nickname || 'Jugador') : estado.rivalNombre;
            mostrarMensaje((tipo === 'golazo' ? '💥' : '⚽') + ' ¡' + (tipo === 'golazo' ? 'GOLAZO' : 'GOL') + ` de ${nombreAtacante}!`);
        }

        function finalizarCanto() {
            // El panel VAR permanece visible hasta que termine la mano (como en play.html)
            estado.juego.cantoActual = null;
            estado.juego.cantoPedidoPor = null;
            estado.juego.cantoPendiente = null;
            estado.juego.esperandoRespuestaDe = null;
            estado.juego.varDeclaraciones = { jugador: null, rival: null };
            estado.juego.varTurnoDeclarar = null;
            estado.juego.varPedidoPor = null;
            estado.juego.penalActivo = false;
            estado.juego.penalAtacante = null;
            estado.juego.penalCartas = [];
            estado.juego.golActivo = false;
            estado.juego.golAtacante = null;
            estado.juego.golCartas = [];

            if (estado.juego.golEnMano || alguienSinCartas() || estado.juego.rondaActual >= 4) {
                sincronizarJuego();
                setTimeout(finalizarMano, 800);
                return;
            }

            const jugadorJugo = jugadorJugoEstaRonda();
            const rivalJugo = rivalJugoEstaRonda();

            if (jugadorJugo && !rivalJugo) {
                estado.juego.fase = 'esperando_rival';
                estado.juego.turnoActual = 'rival';
                sincronizarJuego();
                renderizarTodo();
                return;
            }
            if (rivalJugo && !jugadorJugo) {
                estado.juego.turnoActual = 'jugador';
                estado.juego.fase = 'esperando_seleccion';
                estado.juego.cartaSeleccionada = null;
                sincronizarJuego();
                renderizarTodo();
                return;
            }

            estado.juego.inicioRonda = estado.juego.cartasEnMesa.length;
            estado.juego.turnoActual = estado.juego.turnoInicial;
            estado.juego.fase = 'esperando_seleccion';
            estado.juego.cartaSeleccionada = null;
            sincronizarJuego();
            continuarFlujo();
        }

            mostrarMensaje(`📺 VAR: ${estado.nickname || 'Jugador'} ${dj} vs ${estado.rivalNombre} ?`);

        function declararVarJugador() {
            const real = numeroMasAltoArqDel(estado.juego.manoJugador);
            estado.juego.varDeclaraciones.jugador = real;
            const dr = estado.juego.varDeclaraciones.rival;
            if (dom.varPanel && dom.varPanelTexto) {
                dom.varPanelTexto.textContent = `${estado.nickname || 'Jugador'} ${real} vs ${estado.rivalNombre} ${dr === null || dr === undefined ? '?' : dr}`;
                dom.varPanel.classList.add('visible');

            sincronizarJuego();
            renderizarTodo();
            verificarVarResolucion();
        }

        function verificarVarResolucion() {
            if (estado.juego.fase !== 'var_pedido') return;
            // Solo el declarante (quien pidió el VAR) resuelve para evitar doble resolución
            if (estado.juego.varTurnoDeclarar !== 'jugador') return;
            const dj = estado.juego.varDeclaraciones.jugador;
            const dr = estado.juego.varDeclaraciones.rival;
            if (dj === null || dj === undefined || dr === null || dr === undefined) return;
            resolverVar(dj, dr);
        }

        function resolverVar(dj, dr) {
            const varPedidoPor = estado.juego.varPedidoPor;
            const cantoPedidoPor = estado.juego.cantoPedidoPor;

            if (dom.varPanel && dom.varPanelTexto) {
                dom.varPanelTexto.textContent = `${estado.nickname || 'Jugador'} ${dj} vs ${estado.rivalNombre} ${dr}`;
                dom.varPanel.classList.add('visible');
            }
            mostrarMensaje(`📺 VAR: ${estado.nickname || 'Jugador'} ${dj} vs ${estado.rivalNombre} ${dr}`);

            if (dj > dr) {
                if (varPedidoPor === 'jugador') {
                    sumarPuntos('jugador', 2);
                    mostrarMensaje(`📺 VAR: Ganaste. Penal cancelado`);
                    finalizarCanto();
                } else {
                    sumarPuntos('jugador', 2);
                    mostrarMensaje(`📺 VAR: Ganaste. Se ejecuta el penal`);
                    if (estado.juego.golEnMano) setTimeout(finalizarMano, 2200);
                    else ejecutarCanto('penal', cantoPedidoPor);
                }
            } else if (dr > dj) {
                if (varPedidoPor === 'rival') {
                    sumarPuntos('rival', 2);
                    mostrarMensaje(`📺 VAR: ${estado.rivalNombre} gana. Penal cancelado`);
                    finalizarCanto();
                } else {
                    sumarPuntos('rival', 2);
                    mostrarMensaje(`📺 VAR: ${estado.rivalNombre} gana. Se ejecuta el penal`);
                    if (estado.juego.golEnMano) setTimeout(finalizarMano, 2200);
                    else ejecutarCanto('penal', cantoPedidoPor);
                }
            } else {
                mostrarMensaje(`📺 VAR: Empate. Se ejecuta el penal`);
                ejecutarCanto('penal', cantoPedidoPor);
            }
        }

        // ============ MARCADOR DETALLADO ============
        function actualizarTablaMarcador() {
            if (!dom.cuerpoTablaMarcador) return;
            dom.cuerpoTablaMarcador.innerHTML = '';
            let acumJ = 0, acumR = 0;
            for (let i = 0; i < TOTAL_MANOS; i++) {
                const minuto = MINUTOS[i];
                const tr = document.createElement('tr');
                const esActual = i === estado.juego.manoActual && estado.juego.fase !== 'fin_partido';
                const esPasada = i < estado.juego.manoActual;
                if (esActual) tr.classList.add('fila-actual');
                const hist = estado.juego.historialManos.find(h => h.minuto === minuto);

                let gJ, gR, pJ, pR;
                if (esActual) {
                    gJ = estado.juego.golesJugador;
                    gR = estado.juego.golesRival;
                    pJ = estado.juego.puntosManoJugador + estado.juego.puntosJugador;
                    pR = estado.juego.puntosManoRival + estado.juego.puntosRival;
                } else if (esPasada && hist) {
                    acumJ += hist.golesJugador;
                    acumR += hist.golesRival;
                    gJ = acumJ;
                    gR = acumR;
                    pJ = hist.puntosJugador;
                    pR = hist.puntosRival;
                } else {
                    gJ = '-';
                    gR = '-';
                    pJ = 0;
                    pR = 0;
                }

                let eJ = '', eR = '';
                for (let s = 0; s < Math.min(pJ, 3); s++) eJ += '★';
                for (let s = 0; s < Math.min(pR, 3); s++) eR += '★';
                tr.innerHTML =
                    `<td>${minuto}</td><td>${eJ} ⚽${gJ}</td><td style="color:rgba(255,255,255,0.3)">vs</td><td>⚽${gR} ${eR}</td>`;
                dom.cuerpoTablaMarcador.appendChild(tr);
            }
        }

        function mostrarMarcadorDetallado() {
            if (estado.fase !== 'jugando') return;
            dom.overlayMarcador.classList.remove('oculto');
            actualizarTablaMarcador();
