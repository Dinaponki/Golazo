            dom.overlayMarcador.classList.add('oculto');
        }

        // ============ GUARDAR RESULTADO ONLINE ============
        async function guardarResultadoPartidoOnline(resultado, golesJugador, golesRival) {
            const user = estado.usuario;
            if (!user) return;
            try {
                // Guardar en el nodo onlineStats (separado de las estadísticas vs CPU)
                const userRef = ref(db, 'usuarios/' + user.uid + '/onlineStats');
                const snap = await get(userRef);
                const datos = snap.exists() ? snap.val() : {};
                // Inicializar el nodo la primera vez (si no existe, el ranking
                // online no podía calcular ni puntos ni partidos del jugador)
                if (datos.puntos === undefined && datos.partidosJugados === undefined) {
                    datos.puntos = 0;
                    datos.partidosJugados = 0;
                    datos.partidosGanados = 0;
                    datos.partidosEmpatados = 0;
                    datos.partidosPerdidos = 0;
                    datos.rachaActual = 0;
                    datos.mejorRacha = 0;
                    datos.golesFavor = 0;
                    datos.golesContra = 0;
                    datos.historialPartidos = [];
                }

                // Determinar resultado relativo para este jugador
                const ganador = resultado.ganador;
                const yoGane = (estado.miLado === 'jugador' && ganador === 'jugador') || (estado.miLado === 'rival' && ganador === 'rival');
                const esEmpate = ganador === 'empate';
                const resultadoJugador = esEmpate ? 'empate' : (yoGane ? 'ganar' : 'perder');

                const partidosJugados = (datos.partidosJugados || 0) + 1;
                const partidosGanados = (datos.partidosGanados || 0) + (resultadoJugador === 'ganar' ? 1 : 0);
                const partidosEmpatados = (datos.partidosEmpatados || 0) + (resultadoJugador === 'empate' ? 1 : 0);
                const partidosPerdidos = (datos.partidosPerdidos || 0) + (resultadoJugador === 'perder' ? 1 : 0);

                let rachaActual = datos.rachaActual || 0;
                if (resultadoJugador === 'ganar') rachaActual++;
                if (resultadoJugador === 'perder') rachaActual = 0;

                const mejorRacha = Math.max(datos.mejorRacha || 0, rachaActual);
                const efectividad = partidosJugados > 0 ? Math.round((partidosGanados / partidosJugados) * 1000) / 10 : 0;
                // Sumar los puntos INCREMENTALMENTE sobre el acumulado existente:
                // así el abandono (-5) resta siempre y no se pierde si el jugador
                // ya tenía una derrota previa (que la fórmula reconstruida pisaba).
                const puntos = (datos.puntos || 0) + (resultadoJugador === 'ganar' ? 3 : esEmpate ? 1 : -5);

                // Goles a favor y en contra (relativos a este jugador)
                const golesFavor = (datos.golesFavor || 0) + (golesJugador || 0);
                const golesContra = (datos.golesContra || 0) + (golesRival || 0);

                // Historial de partidos para filtros por período
                const historialPartidos = datos.historialPartidos || [];
                historialPartidos.push({
                    fecha: Date.now(),
                    resultado: resultadoJugador,
                    golesFavor: golesJugador || 0,
                    golesContra: golesRival || 0,
                    online: true
                });
                const historialLimitado = historialPartidos.slice(-200);

                const camposActualizar = {
                    partidosJugados,
                    partidosGanados,
                    partidosEmpatados,
                    partidosPerdidos,
                    puntos,
                    efectividad,
                    rachaActual,
                    mejorRacha,
                    golesFavor,
                    golesContra,
                    historialPartidos: historialLimitado,
                    // Limpiar este mismo en el guardado: si quedó un abandono pendiente
                    // de una sesión anterior (pestaña cerrada), una partida normal
                    // posterior no debe procesarlo como derrota.
                    abandonoPendiente: false,
                    ultimaActualizacion: serverTimestamp()
                };

                await update(userRef, camposActualizar);
                console.log('Resultado online guardado en Firebase:', resultadoJugador, camposActualizar);
            } catch (error) {
                console.error('Error guardando resultado online:', error);
                const textoError = String((error && (error.code || error.message)) || '').toLowerCase();
                const esPermiso = textoError.includes('permission');
                const mensaje = document.getElementById('mensajeFlotante');
                if (mensaje) {
                    // Si Firebase rechaza la escritura, el jugador NO pierde puntos:
                    // avisarlo de forma clara y persistente con la causa y la solución
                    mensaje.textContent = esPermiso
                        ? '⚠ FIREBASE BLOQUEÓ EL GUARDADO (permission_denied): publicá las reglas nuevas de reglas-firebase.json en Consola → Realtime Database → Reglas'
                        : '⚠ No se pudo guardar el resultado: ' + (error.code || error.message || 'error desconocido');
                    mensaje.classList.add('mostrar');
                    setTimeout(() => mensaje.classList.remove('mostrar'), 8000);
                }
            }
        }

        // ================= ABANDONO PENDIENTE (procesamiento local) =================
        // El castigo por abandonar sin terminar debe aplicarse DONDE SEA que el
        // jugador se reconecte: index.html O este lobby (playonline.html).
        // La marca onlineStats.abandonoPendiente la deja armada el propio cliente
        // al salir sin cerrar bien la partida (pagehide / onDisconnect) y esta
        // TRANSACCIÓN la consume UNA sola vez (si ya fue procesada, no escribe).
        let procesandoAbandonoOnline = false;

        async function aplicarPenalizacionAbandonoOnline(uid) {
            if (procesandoAbandonoOnline) return;
            procesandoAbandonoOnline = true;
            try {
                const statsRef = ref(db, 'usuarios/' + uid + '/onlineStats');
                // Transacción atómica: si otra pestaña/dispositivo la procesó antes,
                // el flag ya está limpio y acá no se vuelve a restar nada.
                const resultado = await runTransaction(statsRef, (on) => {
                    // Nodo inexistente: abortar sin cambios (undefined), nunca null
                    if (!on || typeof on !== 'object') return undefined;
                    if (on.abandonoPendiente !== true) return on; // limpio: sin cambios
                    const partidosJugados = (on.partidosJugados || 0) + 1;
                    const partidosPerdidos = (on.partidosPerdidos || 0) + 1;
                    const partidosGanados = (on.partidosGanados || 0);
                    on.partidosJugados = partidosJugados;
                    on.partidosPerdidos = partidosPerdidos;
                    on.puntos = (on.puntos || 0) - 5;
                    on.efectividad = partidosJugados > 0 ? Math.round((partidosGanados / partidosJugados) * 1000) / 10 : 0;
                    on.rachaActual = 0;
                    const historial = Array.isArray(on.historialPartidos) ? on.historialPartidos : [];
                    historial.push({
                        fecha: Date.now(),
                        resultado: 'perder',
                        golesFavor: 0,
                        golesContra: 0,
                        online: true,
                        abandono: true
                    });
                    on.historialPartidos = historial.slice(-200);
                    on.abandonoPendiente = false;
                    on.ultimaActualizacion = serverTimestamp();
                    return on;
                });
                if (resultado.committed) {
                    const on = resultado.snapshot.val();
                    if (on && on.abandonoPendiente !== true) {
                        console.log('Abandono online detectado: -5 puntos');
                        mostrarMensaje('⚠ Abandonaste una partida online: -5 puntos');
                    }
                }
            } catch (error) {
                console.error('Error aplicando abandono online:', error);
                const textoError = String((error && (error.code || error.message)) || '').toLowerCase();
                if (textoError.includes('permission')) {
                    mostrarMensaje('⚠ Firebase bloqueó el castigo: publicá las reglas nuevas');
                }
            } finally {
                procesandoAbandonoOnline = false;
            }
        }

        // Listener en vivo sobre la marca: la procesa apenas aparezca, incluso si
        // onDisconnect la escribe varios segundos DESPUÉS de cargar esta página.
        function vigilarAbandonoOnline(uid) {
            try {
                const flagRef = ref(db, 'usuarios/' + uid + '/onlineStats/abandonoPendiente');
                onValue(flagRef, (snap) => {
                    if (snap.val() === true) aplicarPenalizacionAbandonoOnline(uid);
                }, (error) => console.error('Error vigilando abandono online:', error));
            } catch (error) { console.error('Error vigilando abandono online:', error); }
        }

        ];

        function calcularStatsTotalesLogros(datos) {
            const cpu = datos || {};
            const on = (datos && datos.onlineStats) || {};
            const pj = (cpu.partidosJugados || 0) + (on.partidosJugados || 0);
            const pg = (cpu.partidosGanados || 0) + (on.partidosGanados || 0);
            const pe = (cpu.partidosEmpatados || 0) + (on.partidosEmpatados || 0);
            return {
                pj, pg, pe,
                gf: (cpu.golesFavor || 0) + (on.golesFavor || 0),
                mejorRacha: Math.max(cpu.mejorRacha || 0, on.mejorRacha || 0),
                efectividad: pj > 0 ? Math.round((pg / pj) * 1000) / 10 : 0,
                pjCpu: cpu.partidosJugados || 0,
                pjOnline: on.partidosJugados || 0,
                diasConsecutivos: (datos && datos.loginStreak) || 0
            };
        }

        // Verifica y desbloquea logros nuevos tras terminar una partida
        async function verificarLogros() {
            const user = estado.usuario;
            if (!user) return;
            try {
                const userRef = ref(db, 'usuarios/' + user.uid);
                const snap = await get(userRef);
                if (!snap.exists()) return;
                const datos = snap.val();
                const stats = calcularStatsTotalesLogros(datos);
                const logrosActuales = datos.logros || {};
                const nuevos = [];
                for (const l of LOGROS) {
                    if (!logrosActuales[l.id] && l.check(stats)) {
                        nuevos.push(l);
                        logrosActuales[l.id] = Date.now();
                    }
                }
                if (nuevos.length) {
                    await update(userRef, { logros: logrosActuales });
                    mostrarMensaje('🏅 ¡Nuevo logro: ' + nuevos[0].icono + ' ' + nuevos[0].nombre + '!' +
                        (nuevos.length > 1 ? ' (+' + (nuevos.length - 1) + ' más)' : ''));
                }
            } catch (e) {
                console.error('Error verificando logros:', e);
            }
        }

        // ============ FIN DE PARTIDA ============
        // Borra la partida TERMINADA de Firebase para que la base no acumule
        // millones de partidas. Ambos clientes lo intentan (es idempotente):
        // 1) A los 1 y 6 minutos de mostrarse la pantalla de fin.
        // 2) Al salir de la pantalla de fin ("Jugar otra vez" / "Volver al
        //    inicio"), porque los timers programados mueren al navegar.
        // Si ningún cliente logra borrarla, queda el barrido automático
        // (playonline.html e index.html) que la elimina a los 2 minutos.
        let borradoFinProgramado = false;
        let finPartidoEn = 0;

        async function intentarBorrarPartidaTerminada(respetarGracia) {
            const cod = estado.partidaId;
            if (!cod || !estado.usuario) return false;
            // Gracia opcional de 1 minuto desde el fin, para que el rival
            // (aunque esté unos segundos desconectado) vea el resultado
            if (respetarGracia && finPartidoEn && Date.now() - finPartidoEn < 60 * 1000) return false;
            try {
                const snap = await get(ref(db, 'partidas/' + cod));
                const p = snap.val();
                // Solo borrar si sigue 'terminada' (nunca una partida viva)
                if (p && p.estado === 'terminada') {
                    await remove(ref(db, 'partidas/' + cod));
                    console.log('Partida terminada eliminada de Firebase:', cod);
                    return true;
                }
            } catch (e) { /* si falla, el reintento o el barrido la eliminarán */ }
            return false;
        }

        function programarBorradoPartidaTerminada() {
            if (borradoFinProgramado) return;
            borradoFinProgramado = true;
            setTimeout(() => intentarBorrarPartidaTerminada(false), 60 * 1000);     // 1 minuto de gracia
            setTimeout(() => intentarBorrarPartidaTerminada(false), 6 * 60 * 1000); // reintento por si el primero falló
        }

        function mostrarFinPartido(resultado) {
            // Evitar doble ejecución: esta función puede ser llamada tanto
            // directamente desde finalizarMano() como desde el listener de
            // Firebase (partida.estado === 'terminada'). Solo procesar una vez.
            if (estado.fase === 'fin') return;
            estado.fase = 'fin';
            estado.enPartida = false;
            // Marcar la partida como terminada: a partir de acá ningún evento
            // automático (cambio de pestaña, botón atrás, etc.) puede quitar
            // esta pantalla ni registrar un abandono.
            estado.partidaTerminada = true;
            finPartidoEn = Date.now();
            dom.overlayFin.classList.remove('oculto');
            // Cancelar TODOS los registros de desconexión: la partida ya terminó
            // bien y salir de la página no debe disparar limpiezas ni abandonos falsos.
            cancelarRegistroDesconexion();
            // Programar el borrado definitivo de esta partida terminada en Firebase
            programarBorradoPartidaTerminada();
            // Convertir goles absolutos a relativos
            const gJ = estado.miLado === 'jugador' ? (resultado.golesJugador || 0) : (resultado.golesRival || 0);
            const gR = estado.miLado === 'jugador' ? (resultado.golesRival || 0) : (resultado.golesJugador || 0);
            const ganador = resultado.ganador;
            const yoGane = (estado.miLado === 'jugador' && ganador === 'jugador') || (estado.miLado === 'rival' && ganador === 'rival');
            // Guardar el resultado en el ranking online SIEMPRE (partidas rápidas
            // y por código): cada cliente registra su propio resultado al ver el
            // fin. El que abandonó registra derrota (-5 pts) y el rival victoria
            // (+3 pts), así la repartija de puntos queda completa para los dos.
            // EXCEPCIÓN (evita doble -5): si perdí por un abandono que NO inicié yo
            // (el rival cerró la pestaña y mi conexión cayó), el rival YA aplicó mi
            // castigo directamente en mis stats vía aplicarPenalizacionAbandono,
            // así que mi cliente no debe registrar la derrota otra vez.
            const perdiPorAbandonoDelRival = resultado.abandono && !yoGane && !abandonoIniciadoPorMi;
            if (!perdiPorAbandonoDelRival) {
                guardarResultadoPartidoOnline(resultado, gJ, gR);
            }
            // Verificar y desbloquear logros nuevos
            verificarLogros();

            if (resultado.abandono) {
                if (yoGane) {
                    dom.resultadoTitulo.textContent = '¡GANASTE!';
                    dom.resultadoTitulo.className = 'resultado-titulo ganaste';
                    dom.resultadoMarcador.textContent = 'Tu rival abandonó la partida';
                } else {
                    dom.resultadoTitulo.textContent = 'PERDISTE';
                    dom.resultadoTitulo.className = 'resultado-titulo perdiste';
                    dom.resultadoMarcador.textContent = 'Abandonaste la partida';
                }
            } else {
                if (gJ > gR) {
                    if (yoGane) { dom.resultadoTitulo.textContent = '¡GANASTE!'; dom.resultadoTitulo.className = 'resultado-titulo ganaste'; }
                    else { dom.resultadoTitulo.textContent = 'PERDISTE'; dom.resultadoTitulo.className = 'resultado-titulo perdiste'; }
                } else if (gR > gJ) {
                    if (yoGane) { dom.resultadoTitulo.textContent = '¡GANASTE!'; dom.resultadoTitulo.className = 'resultado-titulo ganaste'; }
                    else { dom.resultadoTitulo.textContent = 'PERDISTE'; dom.resultadoTitulo.className = 'resultado-titulo perdiste'; }
                } else {
                    dom.resultadoTitulo.textContent = 'EMPATE';
                    dom.resultadoTitulo.className = 'resultado-titulo empate';
                }
                dom.resultadoMarcador.textContent = `${estado.nickname || 'Jugador'} ${gJ} - ${gR} ${estado.rivalNombre}`;
            }
            detenerAudioFondo();
        }

        // ============ ABANDONAR ============
        async function abandonarPartida() {
            // Si la partida ya terminó, no hacer nada: no sobrescribir el
            // resultado con un abandono ni navegar fuera de la pantalla de fin.
            if (estado.fase === 'fin' || estado.partidaTerminada) return;
            // El abandono lo inicio YO: mi cliente registra su propia derrota
            // (-5) y el flag evita que el rival la aplique también.
            abandonoIniciadoPorMi = true;
            // El que abandona SIEMPRE pierde, sin importar si después falla la
            // escritura en Firebase: construimos su resultado de abandono antes.
            const miResultado = {
                ganador: estado.miLado === 'jugador' ? 'rival' : 'jugador',
                golesJugador: 0,
                golesRival: 0,
                abandono: true
            };
            if (estado.partidaId && estado.enPartida) {
                try {
                    const partidaRef = ref(db, 'partidas/' + estado.partidaId);
                    const snap = await get(partidaRef);
                    if (snap.exists()) {
                        const partida = snap.val();
                        miResultado.golesJugador = partida.juego ? partida.juego.golesJugador : 0;
                        miResultado.golesRival = partida.juego ? partida.juego.golesRival : 0;
                        await update(partidaRef, {
                            estado: 'terminada',
                            resultado: miResultado,
                            // Marco que MI castigo ya lo estoy aplicando yo mismo en
                            // este momento: así el rival (si además recibió el
                            // abandonadoPor por una desconexión simultánea) no aplica
                            // el castigo directo dos veces.
                            penalidadAbandono: true,
                            ultimaActividad: Date.now()
                        });
                    }
                } catch (error) { console.error('Error abandonando partida:', error); }
            }
            // Limpieza simétrica (vale para el creador y para el que se unió):
            // soltar la escucha de la cola de matchmaking, anular los registros
            // de desconexión pendientes y borrar nuestra entrada de la cola.
            detenerEscuchaColaRapido();
            cancelarRegistroDesconexion();
            if (estado.usuario) remove(ref(db, 'cola_rapido/' + estado.usuario.uid)).catch(() => {});
            // El que sale SIEMPRE ve la pantalla final: acá se registran sus
            // propios puntos (derrota por abandono, -5) igual que el rival
            // registra su victoria (+3) al detectar la partida terminada.
            // Así la repartija de puntos queda completa para los dos lados.
            mostrarFinPartido(miResultado);
        }

        // ============ CANCELAR ESPERA ============
        // Vuelve al lobby desde la espera, con toda la limpieza (listeners,
        // registros de desconexión, estado e historial). Se usa tanto al
        // cancelar manualmente como cuando la partida desaparece sola.
        function volverAlLobbyDeEspera() {
            detenerEscuchaColaRapido();
            detenerReintentoEmparejamiento();
            cancelarRegistroDesconexion();
            if (partidaListener) { partidaListener(); partidaListener = null; }
            ultimoEstadoJuego = null;
            // Limpiar MI entrada de la cola: si vuelvo al lobby es porque mi
            // partida desapareció (borrada manualmente, rival muerto, etc.) y
            // una entrada fantasma mía envenenaría el matchmaking ajeno
            if (estado.usuario) remove(ref(db, 'cola_rapido/' + estado.usuario.uid)).catch(() => {});
            estado.partidaId = null;
            estado.miLado = null;
            estado.fase = 'lobby';
            dom.overlayEsperando.classList.add('oculto');
            dom.overlayLobby.classList.remove('oculto');
            // Rehabilitar TODOS los botones del lobby: jugarRapido() deshabilita
            // los tres al empezar la búsqueda y solo los rehabilita en su rama
            // de error. Sin esto, tras cancelar la búsqueda rápida el botón
            // "⚡ Jugar rápido" quedaba muerto hasta recargar la página.
            dom.btnJugarRapido.disabled = false;
            dom.btnCrearPartida.disabled = false;
            dom.btnUnirsePartida.disabled = false;
            // Restaurar el código visible: la búsqueda rápida lo oculta con
            // display:none y una "Crear partida" posterior debe mostrarlo
            dom.codigoPartida.style.display = '';
            dom.codigoPartida.textContent = '------';
            // Consumir el estado de historial que empujamos al entrar en espera,
            // para que "atrás" no quede pisando en la misma página
            if (esperaPushHecha) {
                esperaPushHecha = false;
                try { history.back(); } catch (e) { /* noop */ }
            }
        }

        async function cancelarEspera() {
            if (estado.partidaId && estado.miLado === 'jugador') {
                try { await remove(ref(db, 'partidas/' + estado.partidaId)); }
                catch (error) { console.error('Error cancelando partida:', error); }
            }
            // Limpieza de matchmaking: si esto era una partida rápida, sacar
            // nuestra entrada de la cola (si queda un fantasma en cola_rapido,
            // otros jugadores intentan unirse a una partida que ya no existe)
            if (estado.usuario) remove(ref(db, 'cola_rapido/' + estado.usuario.uid)).catch(() => {});
            volverAlLobbyDeEspera();
        }

        // ============ LIMPIEZA DE DATOS VENCIDOS ============
        // /partidas y /cola_rapido crecían para siempre. onDisconnect() ya cubre
        // la salida limpia del navegador (borra partida + entrada de cola), pero
        // quedaban restos: partidas terminadas/abandonadas nunca borradas y
        // entradas de cola huérfanas. Cada cliente conectado hace de basurero:
        // periódicamente borra nodos cuya última actividad sea muy vieja.
        const LIMPIEZA_CADA_MS = 5 * 60 * 1000;       // barrer cada 5 minutos
        const PARTIDA_EXPIRA_MS = 2 * 60 * 60 * 1000; // partidas viejas: 2 horas
        const COLA_EXPIRA_MS = 15 * 60 * 1000;        // entradas de cola: 15 minutos
        const TERMINADA_GRACIA_MS = 2 * 60 * 1000;    // gracia de una terminada: 2 minutos
        let limpiezaIniciada = false;

        async function limpiarDatosVencidos() {
            try {
                const ahora = Date.now();
                // Lectura COMPLETA de /partidas (permitida por ".read": es la vía
                // más robusta: NO depende de que los .indexOn estén publicados en
                // las reglas — si una consulta indexada falla por índice faltante,
                // antes se cancelaba TODO el barrido y nada se borraba jamás).
                // Con la limpieza activa la base no crece, así que leerla entera
                // cada 5 minutos es liviano y suficiente.
                const [pSnap, cSnap] = await Promise.all([
                    get(ref(db, 'partidas')).catch(() => null),
                    get(ref(db, 'cola_rapido')).catch(() => null)
                ]);
                const borrados = {};
                if (pSnap && pSnap.exists()) {
                    pSnap.forEach((child) => {
                        const p = child.val() || {};
                        // No tocar la partida VIVA en la que estoy parado; la mía
                        // ya TERMINADA sí puedo barrerla (el fin ya ocurrió)
                        if (child.key === estado.partidaId && p.estado !== 'terminada') return;
                        const act = p.ultimaActividad || p.creadoEn || 0;
                        if (!act) return;
                        const antiguedad = ahora - act;
                        // TERMINADA tras 2 min de gracia (para que el rival vea
                        // el resultado): fuera sí o sí, aunque nadie esté conectado
                        if (p.estado === 'terminada' && antiguedad > TERMINADA_GRACIA_MS) {
                            borrados['partidas/' + child.key] = null;
                        // Cualquier otra partida inactiva hace más de 2 horas
                        } else if (antiguedad > PARTIDA_EXPIRA_MS) {
                            borrados['partidas/' + child.key] = null;
                        }
                    });
                }
                if (cSnap && cSnap.exists()) {
                    cSnap.forEach((child) => {
                        const c = child.val() || {};
                        const creado = c.creadoEn || 0;
                        if (creado && ahora - creado > COLA_EXPIRA_MS) borrados['cola_rapido/' + child.key] = null;
                    });
                }
                if (Object.keys(borrados).length) {
                    await update(ref(db), borrados); // borrado multi-camino, 1 sola escritura
                    console.log('Limpieza automática: eliminados', Object.keys(borrados).length, 'nodos vencidos');
                }
            } catch (e) { console.warn('Limpieza automática omitida:', e && (e.code || e.message)); }
        }

        function iniciarLimpiezaAutomatica() {
            if (limpiezaIniciada) return;
            limpiezaIniciada = true;
            setTimeout(limpiarDatosVencidos, 5000); // primer barrido apenas entra (antes: 20 s)
            setInterval(limpiarDatosVencidos, LIMPIEZA_CADA_MS);
        }

        // ============ INICIALIZACIÓN ============
        function inicializar() {
            cacheDom();
            actualizarEscalado();
            iniciarLimpiezaAutomatica(); // barrido periódico de partidas/colas vencidas

            onAuthStateChanged(auth, (user) => {
                estado.usuario = user;
                if (user) {
                    // Procesar y vigilar el abandono pendiente TAMBIÉN acá: el
                    // jugador puede reconectar directo al lobby online sin pasar
                    // por index.html, y el castigo debe aplicarse igual.
                    aplicarPenalizacionAbandonoOnline(user.uid);
                    vigilarAbandonoOnline(user.uid);
                    const userRef = ref(db, 'usuarios/' + user.uid + '/nickname');
                    onValue(userRef, (snap) => {
                        const nick = snap.val() || '';
                        estado.nickname = nick && nick.length >= 3 ? nick : (user.displayName || 'Jugador');
                        estado.fotoURL = user.photoURL || '';
                        dom.lobbySubtitulo.textContent = 'Jugando como: ' + estado.nickname;
                        dom.btnJugarRapido.disabled = false;
                        dom.btnCrearPartida.disabled = false;
                        dom.inputCodigo.disabled = false;
                        dom.btnUnirsePartida.disabled = false;
                    }, (error) => {
                        console.error('Error obteniendo nickname:', error);
                        estado.nickname = user.displayName || 'Jugador';
                        estado.fotoURL = user.photoURL || '';
                        dom.lobbySubtitulo.textContent = 'Jugando como: ' + estado.nickname;
                        dom.btnJugarRapido.disabled = false;
                        dom.btnCrearPartida.disabled = false;
                        dom.inputCodigo.disabled = false;
                        dom.btnUnirsePartida.disabled = false;
                    });
                } else {
                    dom.lobbySubtitulo.textContent = 'Necesitás iniciar sesión para jugar online';
                    dom.btnJugarRapido.disabled = true;
                    dom.btnCrearPartida.disabled = true;
                    dom.inputCodigo.disabled = true;
                    dom.btnUnirsePartida.disabled = true;
                    mostrarLobbyMensaje('Volvé al inicio e iniciá sesión con Google.', true);
                }
            });

            dom.btnJugarRapido.addEventListener('click', jugarRapido);
            dom.btnCrearPartida.addEventListener('click', crearPartida);
            dom.btnUnirsePartida.addEventListener('click', unirsePartida);
            dom.btnVolverInicio.addEventListener('click', () => {
                if (estado.enPartida || estaEsperando()) {
                    mostrarOverlaySalida();
                } else {
                    window.location.href = 'index.html';
                }
            });
            // El "✕ Cancelar" de la espera ahora pasa por la advertencia de
            // salida (igual que el jugador que se une después en plena partida)
            dom.btnCancelarEspera.addEventListener('click', () => {
                if (estaEsperando()) mostrarOverlaySalida();
                else cancelarEspera();
            });

            dom.inputCodigo.addEventListener('input', () => {
                dom.inputCodigo.value = dom.inputCodigo.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, CODIGO_LENGTH);
            });
            dom.inputCodigo.addEventListener('keydown', (e) => { if (e.key === 'Enter') unirsePartida(); });

            dom.btnSonido.addEventListener('click', (e) => {
                e.stopPropagation();
                estado.sonidosActivados = !estado.sonidosActivados;
                dom.btnSonido.classList.toggle('activo', estado.sonidosActivados);
                dom.btnSonido.classList.toggle('desactivado', !estado.sonidosActivados);
                dom.btnSonido.textContent = estado.sonidosActivados ? '🔊' : '🔇';
            });

            dom.btnMusica.addEventListener('click', (e) => {
                e.stopPropagation();
                estado.musicaActivada = !estado.musicaActivada;
                dom.btnMusica.classList.toggle('activo', estado.musicaActivada);
                dom.btnMusica.classList.toggle('desactivado', !estado.musicaActivada);
                dom.btnMusica.textContent = estado.musicaActivada ? '🎵' : '🎵';
                if (!estado.musicaActivada) detenerAudioFondo();
                else reproducirAudioFondo();
            });

            // Botones de acción
            dom.btnPenal.addEventListener('click', () => { if (!dom.btnPenal.disabled) jugadorPidePenal(); });
            dom.btnQuieroIzq.addEventListener('click', () => { if (!dom.btnQuieroIzq.disabled) jugadorRespondeQuiero(); });
            dom.btnNoQuieroIzq.addEventListener('click', () => { if (!dom.btnNoQuieroIzq.disabled) jugadorRespondeNoQuiero(); });
            dom.btnVar.addEventListener('click', () => {
                if (!dom.btnVar.disabled) {
                    if (estado.juego.fase === 'var_pedido' && estado.juego.varTurnoDeclarar === 'jugador') declararVarJugador();
                    else if (estado.juego.fase === 'penal_pedido') jugadorRespondeVar();
                }
            });
            dom.btnGol.addEventListener('click', () => { if (!dom.btnGol.disabled) jugadorPideGol(); });
            dom.btnQuieroDer.addEventListener('click', () => { if (!dom.btnQuieroDer.disabled) jugadorRespondeQuiero(); });
            dom.btnNoQuieroDer.addEventListener('click', () => { if (!dom.btnNoQuieroDer.disabled) jugadorRespondeNoQuiero(); });
            dom.btnGolazo.addEventListener('click', () => { if (!dom.btnGolazo.disabled) jugadorRespondeGolazo(); });

            dom.btnCancelarSalida.addEventListener('click', () => dom.overlaySalida.classList.remove('visible'));
            dom.btnConfirmarSalida.addEventListener('click', () => {
                dom.overlaySalida.classList.remove('visible');
                // Durante la espera la salida correcta es cancelarEspera()
                // (borra partida + entrada de cola); en partida, abandonarPartida()
                if (estaEsperando()) cancelarEspera();
                else abandonarPartida();
            });

            dom.btnRevancha.addEventListener('click', () => {
                // Último intento de borrado antes de recargar: al navegar mueren
                // los timers programados, así que intentamos eliminar acá mismo
                // la partida terminada (con su minuto de gracia ya cumplido o no:
                // ambos jugadores ya vieron el resultado en pantalla).
                Promise.race([
                    intentarBorrarPartidaTerminada(false),
                    new Promise(r => setTimeout(r, 2500)) // no trabarn la recarga si la red está lenta
                ]).then(() => window.location.reload());
            });

            // ---------- Compartir resultado (link de referidos) ----------
            dom.btnCompartir.addEventListener('click', async () => {
                const titulo = dom.resultadoTitulo.textContent || '';
                const marcador = dom.resultadoMarcador.textContent || '';
                const base = location.origin + location.pathname.replace(/[^/]*$/, '');
                const link = base + 'index.html?ref=' + encodeURIComponent(estado.nickname || 'Jugador');
                const texto = `⚽ ${titulo} | ${marcador}
🎮 Jugá GOLAZO - El Truco del Fútbol:
${link}`;
                try {
                    if (navigator.share) {
                        await navigator.share({ title: 'GOLAZO', text: texto });
                    } else {
                        await navigator.clipboard.writeText(texto);
                        mostrarMensaje('📋 Resultado copiado. ¡Pegalo donde quieras!');
                    }
                } catch (e) {
                    // El usuario canceló el compartir o falló el portapapeles
                    console.log('Compartir cancelado:', e);
                }
            });

            dom.btnInicio.addEventListener('click', () => {
                if (estado.enPartida || estaEsperando()) {
                    mostrarOverlaySalida();
                    return;
                }
                const irAlInicio = () => { window.location.href = 'index.html'; };
                if (estado.partidaTerminada && estado.partidaId) {
                    // Último intento de borrado antes de irse: al navegar mueren
                    // los timers programados de borrado de la partida terminada
                    Promise.race([
                        intentarBorrarPartidaTerminada(false),
                        new Promise(r => setTimeout(r, 2500))
                    ]).then(irAlInicio);
                } else {
                    irAlInicio();
                }
            });

            // Marcador detallado
            dom.panelMarcador.addEventListener('click', (e) => {
                if (dom.btnSonido.contains(e.target) || dom.btnMusica.contains(e.target)) return;
                mostrarMarcadorDetallado();
            });
            dom.btnVolverMarcador.addEventListener('click', ocultarMarcadorDetallado);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !dom.overlayMarcador.classList.contains('oculto')) ocultarMarcadorDetallado();
                if (e.key === 'Enter' && estado.juego.fase === 'esperando_seleccion' && estado.juego.cartaSeleccionada !== null) jugarCartaSeleccionada();
            });

            window.addEventListener('beforeunload', (e) => {
                // Advertir también durante la ESPERA de rival (partida rápida):
                // antes solo se avisaba con la partida ya empezada
                if (estado.enPartida || estaEsperando()) { e.preventDefault(); e.returnValue = ''; }
            });

            // Al salir de la página en plena partida (doble "atrás" en móvil,
            // cerrar pestaña, cambiar de app...), escribir YA la marca de abandono
            // pendiente en MIS stats. El onDisconnect equivalente tarda varios
            // segundos en efectivizarse en el servidor: sin esta escritura
            // inmediata, el jugador llegaba a index.html, verificarAbandono leía
            // las stats SIN la marca y el abandono quedaba sin registrar.
            // Solo la marca de stats: NO marcamos abandonadoPor en la partida acá,
            // porque el navegador puede restaurar la página desde bfcache (si el
            // usuario volvió con "adelante") y el rival no debe ganarnos por error.
            // Marca de abandono por instancia de partida: SIN este guardia, cada
            // navegación de una página restaurada desde bfcache (que sigue
            // creyendo que está "en partida") re-armaba abandonoPendiente y
            // generaba -5 REPETIDOS entre idas y vueltas: los números del perfil
            // y del ranking se "ponían y se borraban" con cada recarga.
            let marcaAbandonoEnviadaPara = null;
            window.addEventListener('pagehide', () => {
                if (!estado.enPartida || estado.partidaTerminada || estado.fase === 'fin') return;
                if (!estado.usuario || !estado.partidaId) return;
                if (marcaAbandonoEnviadaPara === estado.partidaId) return; // ya marcada
                marcaAbandonoEnviadaPara = estado.partidaId;
                try {
                    update(ref(db, 'usuarios/' + estado.usuario.uid + '/onlineStats'), {
                        abandonoPendiente: true,
                        abandonoPendienteEn: Date.now()
                    }).catch(() => {});
                } catch (e) { /* noop: onDisconnect sigue como respaldo */ }
            });

            // Si la página vuelve desde bfcache (el jugador regresó con "adelante"
            // y la partida siguió viva), deshacer la marca: la salida nunca ocurrió.
            // También re-habilita el marcado para una salida REAL posterior.
            window.addEventListener('pageshow', (e) => {
                if (!e.persisted) return;
                marcaAbandonoEnviadaPara = null;
                if (!estado.enPartida || estado.partidaTerminada || estado.fase === 'fin') return;
                if (!estado.usuario) return;
                try {
                    update(ref(db, 'usuarios/' + estado.usuario.uid + '/onlineStats'), {
                        abandonoPendiente: false
                    }).catch(() => {});
                } catch (e2) { /* noop */ }
            });

            // Interceptar navegación hacia atrás (botón del navegador)
            window.addEventListener('popstate', (e) => {
                if (estado.enPartida || estaEsperando()) {
                    e.preventDefault();
                    mostrarOverlaySalida();
                    // Mantener en la página empujando un nuevo estado
                    history.pushState({ bloqueoSalida: true }, '', location.href);
                    if (estaEsperando()) esperaPushHecha = true;
                }
            });

            // Al ocultar la pestaña, esperar 30 segundos antes de considerar abandono
            // (evita registrar abandono por cambiar de app o minimizar brevemente)
            let tiempoOcultoInicio = 0;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && estado.enPartida) {
                    tiempoOcultoInicio = Date.now();
                } else if (!document.hidden && tiempoOcultoInicio > 0) {
                    const tiempoOcultoMs = Date.now() - tiempoOcultoInicio;
                    // Solo considerar abandono si seguimos DENTRO de una partida
                    // activa. Si la partida terminó mientras la pestaña estaba
                    // oculta, no abandonar: dejar que se vea la pantalla de fin.
                    if (tiempoOcultoMs > 30000 && estado.enPartida && !estado.partidaTerminada) {
                        abandonarPartida();
                    }
                    tiempoOcultoInicio = 0;
                }
            });

            window.addEventListener('resize', () => { if (estado.fase === 'jugando') renderizarTodo(); });

            renderizarTodo();
        }
