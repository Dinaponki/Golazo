<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golazo | Dinaponki</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --verde-fondo: #1a3c2a;
            --verde-mesa: #1e4430;
            --verde-oscuro: #0f2b1a;
            --verde-claro: #2d5a3f;
            --dorado: #c8a84e;
            --dorado-claro: #d4b356;
            --blanco: #f5f5f0;
            --negro: #111;
            --rojo: #c0392b;
            --rojo-oscuro: #962d22;
            --azul: #2980b9;
            --gris-oscuro: #1a1a1a;
            --gris-medio: #333;
            --gris-claro: #888;
            --borde-carta: #1a1a1a;
            --sombra-carta: 0 8px 24px rgba(0, 0, 0, 0.5);
            --sombra-suave: 0 4px 16px rgba(0, 0, 0, 0.35);
            --transicion: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transicion-rapida: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --borde-redondo: 14px;
            --borde-redondo-carta: 10px;
            --carta-mesa: clamp(238.29px, 52.728vmin, 461.37px);
            --carta-mesa-max-h: clamp(330.05px, 72.501vmin, 645.918px);
            --carta-mano: clamp(223.08px, 46.137vmin, 412.088px);
            --carta-mano-max-h: clamp(313.073px, 66.0vmin, 576.713px);
            --carta-cpu: clamp(131.82px, 27.885vmin, 233.22px);
            --carta-cpu-max-h: clamp(182.52px, 37.925vmin, 329.55px);
            --mano-altura: clamp(279.15px, 45.63vmin, 443.625px);
            --btn-font: clamp(11px, 2.6vmin, 15px);
            --btn-pad-y: clamp(7px, 1.6vmin, 13px);
            --btn-pad-x: clamp(9px, 2.2vmin, 20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--verde-fondo);
            color: var(--blanco);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .juego {
            display: grid;
            height: 100dvh;
            max-height: 100dvh;
            width: 100vw;
            max-width: 100vw;
            overflow: hidden;
            position: relative;
            gap: clamp(3px, 0.8vh, 10px);
            padding: clamp(4px, 1vh, 10px);
            grid-template-rows: auto minmax(0, 1fr) auto auto auto;
            grid-template-columns: 1fr;
            grid-template-areas:
                "cpu"
                "mesa"
                "botones"
                "jugador"
                "marcador";
        }

        .zona-cpu { grid-area: cpu; }
        .zona-mesa { grid-area: mesa; }
        .zona-botones { grid-area: botones; }
        .zona-jugador { grid-area: jugador; }
        .panel-marcador { grid-area: marcador; }

        /* Zona CPU */
        .zona-cpu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(2px, 0.5vh, 6px);
            padding: clamp(2px, 0.5vh, 8px) 4px 0;
            flex-shrink: 0;
        }

        .etiqueta-turno {
            font-size: clamp(10px, 2.2vmin, 13px);
            font-weight: 600;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            transition: color 0.3s, transform 0.3s;
        }

        .etiqueta-turno.activo {
            color: var(--dorado);
            transform: scale(1.05);
        }

        .mano-cpu {
            display: flex;
            gap: clamp(4px, 1vmin, 8px);
            justify-content: center;
            flex-wrap: nowrap;
            margin-top: clamp(6px, 1.2vh, 12px);
        }

        /* Zona mesa */
        .zona-mesa {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
            background: radial-gradient(ellipse at center, rgba(30, 68, 48, 0.7) 0%, transparent 70%);
            border-radius: var(--borde-redondo);
            margin: 0 2px;
            overflow: hidden;
        }

        .indicador-canto {
            font-size: clamp(11px, 2.5vmin, 15px);
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--dorado);
            text-align: center;
            min-height: 0;
            padding: clamp(2px, 0.5vh, 4px) clamp(8px, 2vmin, 12px);
            flex-shrink: 0;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 8px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .indicador-canto.visible {
            opacity: 1;
        }

        .mesa-cartas {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            min-height: 0;
            padding: 12px;
            overflow: visible;
        }

        .mesa-fila {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: auto;
            min-height: 0;
        }

        .mesa-cartas .carta-contenedor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: var(--transicion);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        .mesa-cartas .carta-contenedor.ganadora {
            z-index: 6;
            transform: translate(-50%, -50%) translateY(-10px) scale(1.02);
            filter: drop-shadow(0 10px 14px rgba(200,168,78,0.5));
        }

        .mesa-cartas .carta-contenedor.perdedora {
            z-index: 2;
            transform: translate(-50%, -50%) translateY(6px);
            opacity: 0.9;
        }

        .mesa-cartas .carta-img {
            width: var(--carta-mano);
            height: auto;
            max-height: var(--carta-mano-max-h);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Botones */
        .zona-botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 1vmin, 8px);
            padding: clamp(2px, 0.5vh, 6px) 4px;
            flex-shrink: 0;
        }

        .botones-laterales {
            display: flex;
            justify-content: center;
            gap: clamp(4px, 1vmin, 8px);
            padding: 0;
            flex-wrap: wrap;
        }

        .grupo-botones {
            display: flex;
            gap: clamp(4px, 1vmin, 8px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-accion {
            padding: var(--btn-pad-y) var(--btn-pad-x);
            border-radius: 50px;
            font-size: var(--btn-font);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transicion-rapida);
            background: var(--gris-medio);
            color: var(--blanco);
            white-space: nowrap;
            position: relative;
            min-width: clamp(58px, 14vmin, 90px);
            text-align: center;
        }

        .btn-accion:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn-accion:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .btn-penal {
            background: var(--rojo);
            border-color: var(--rojo-oscuro);
        }

        .btn-penal:not(:disabled):hover {
            background: #d44235;
            box-shadow: 0 4px 16px rgba(192, 57, 43, 0.4);
        }

        .btn-gol {
            background: var(--dorado);
            border-color: #a8883a;
            color: #1a2a10;
        }

        .btn-gol:not(:disabled):hover {
            background: var(--dorado-claro);
            box-shadow: 0 4px 16px rgba(200, 168, 78, 0.5);
        }

        .btn-golazo {
            background: #e67e22;
            border-color: #c0651f;
            color: #fff;
        }

        .btn-golazo:not(:disabled):hover {
            background: #f08c34;
            box-shadow: 0 4px 16px rgba(230, 126, 34, 0.5);
        }

        .btn-quiero {
            background: #27ae60;
            border-color: #1e8449;
        }

        .btn-quiero:not(:disabled):hover {
            background: #2ecc71;
            box-shadow: 0 4px 16px rgba(39, 174, 96, 0.4);
        }

        .btn-no-quiero {
            background: #7f8c8d;
            border-color: #6c7a7a;
        }

        .btn-no-quiero:not(:disabled):hover {
            background: #95a5a6;
        }

        .btn-var {
            background: #2980b9;
            border-color: #1f6da0;
        }

        .btn-jugar-carta {
            background: #8e44ad;
            border-color: #6c3483;
        }

        .btn-jugar-carta:not(:disabled):hover {
            background: #9b59b6;
            box-shadow: 0 4px 16px rgba(142, 68, 173, 0.4);
        }

        .btn-var:not(:disabled):hover {
            background: #3498db;
            box-shadow: 0 4px 16px rgba(41, 128, 185, 0.4);
        }

        /* Zona jugador */
        .zona-jugador {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(2px, 0.5vh, 6px);
            padding: 0 4px clamp(2px, 0.5vh, 6px);
            flex-shrink: 0;
        }

        .mano-jugador {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            height: var(--mano-altura);
            min-height: 0;
            width: min(100%, 920px);
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }

        .mano-jugador .carta-contenedor {
            position: absolute;
            transition: var(--transicion);
            cursor: pointer;
            transform-origin: bottom center;
        }

        .mano-jugador .carta-contenedor.seleccionada {
            transform: translateY(clamp(-10px, -2vh, -20px)) scale(1.06);
            z-index: 10 !important;
            filter: brightness(1.1);
        }

        /* Panel marcador */
        .panel-marcador {
            background: var(--gris-oscuro);
            border-radius: var(--borde-redondo);
            padding: clamp(6px, 1.2vh, 10px) clamp(10px, 2.5vw, 16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(6px, 1.5vw, 12px);
            margin: 0;
            box-shadow: var(--sombra-suave);
            cursor: pointer;
            transition: var(--transicion);
            flex-shrink: 0;
        }

        .panel-marcador:hover {
            background: #222;
        }

        .panel-marcador:active {
            transform: scale(0.98);
        }

        .panel-marcador .jugador-info,
        .panel-marcador .cpu-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 60px;
        }

        .panel-marcador .nombre {
            font-size: clamp(9px, 2vmin, 11px);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.7);
        }

        .panel-marcador .goles-numero {
            font-size: clamp(20px, 5vmin, 34px);
            font-weight: 900;
            color: var(--blanco);
            line-height: 1;
        }

        .panel-marcador .estrellas {
            display: flex;
            gap: 4px;
            font-size: clamp(12px, 3vmin, 16px);
        }

        .panel-marcador .estrellas .estrella {
            color: rgba(255, 255, 255, 0.2);
            transition: var(--transicion);
        }

        .panel-marcador .estrellas .estrella.encendida {
            color: var(--dorado);
            text-shadow: 0 0 8px rgba(200, 168, 78, 0.5);
        }

        .panel-marcador .centro-marcador {
            font-size: clamp(11px, 2.5vmin, 14px);
            font-weight: 700;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .panel-marcador .minuto {
            font-size: clamp(10px, 2.2vmin, 12px);
            color: var(--dorado);
        }

        /* Cartas */
        .carta-img {
            display: block;
            border-radius: var(--borde-redondo-carta);
            border: 2px solid var(--borde-carta);
            box-shadow: var(--sombra-carta);
            background: #fff;
            object-fit: contain;
            transition: var(--transicion);
        }

        .carta-img.dorso {
            border-color: #2a2a2a;
        }

        .mano-cpu .carta-img {
            width: var(--carta-cpu);
            height: auto;
            max-height: var(--carta-cpu-max-h);
        }

        .mano-jugador .carta-img {
            width: var(--carta-mano);
            height: auto;
            max-height: var(--carta-mano-max-h);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        /* Overlay bienvenida */
        .overlay-bienvenida {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        .overlay-bienvenida.oculto {
            display: none;
        }

        .bienvenida-contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 360px;
            background: var(--gris-oscuro);
            border-radius: var(--borde-redondo);
            padding: 32px 24px;
            box-shadow: var(--sombra-carta);
        }

        .bienvenida-titulo {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--dorado);
            text-align: center;
        }

        .bienvenida-subtitulo {
            font-size: clamp(14px, 3.5vmin, 18px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .input-nombre {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--gris-medio);
            background: var(--gris-medio);
            color: var(--blanco);
            font-size: clamp(16px, 4vmin, 20px);
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: var(--transicion);
        }

        .input-nombre:focus {
            border-color: var(--dorado);
            background: #3a3a3a;
        }

        .input-nombre::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .contador-caracteres {
            font-size: clamp(11px, 2.5vmin, 13px);
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }

        .btn-empezar {
            width: 100%;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: clamp(16px, 4vmin, 20px);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            background: var(--dorado);
            color: #1a2a10;
            transition: var(--transicion);
        }

        .btn-empezar:hover {
            background: var(--dorado-claro);
            box-shadow: 0 4px 20px rgba(200, 168, 78, 0.4);
        }

        .btn-empezar:active {
            transform: scale(0.97);
        }

        /* Overlay marcador */
        .overlay-marcador {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .overlay-marcador.oculto {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay-marcador .tabla-marcador {
            width: 100%;
            max-width: 500px;
            border-collapse: collapse;
        }

        .overlay-marcador .tabla-marcador th,
        .overlay-marcador .tabla-marcador td {
            padding: 10px 8px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .overlay-marcador .tabla-marcador th {
            font-size: 12px;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .overlay-marcador .tabla-marcador .fila-actual {
            background: rgba(200, 168, 78, 0.15);
            border-radius: 8px;
        }

        .overlay-marcador .tabla-marcador .fila-actual td {
            color: var(--dorado);
            font-weight: 700;
        }

        .overlay-marcador .btn-volver {
            margin-top: 24px;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: var(--blanco);
            color: var(--negro);
            border: none;
            cursor: pointer;
            transition: var(--transicion);
        }

        .overlay-marcador .btn-volver:hover {
            background: #fff;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        /* Overlay fin */
        .overlay-fin {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .overlay-fin.oculto {
            display: none;
        }

        .overlay-fin .resultado-titulo {
            font-size: clamp(36px, 8vw, 60px);
            font-weight: 900;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .overlay-fin .resultado-titulo.ganaste { color: #2ecc71; }
        .overlay-fin .resultado-titulo.perdiste { color: #e74c3c; }
        .overlay-fin .resultado-titulo.empate { color: var(--dorado); }

        .overlay-fin .resultado-marcador {
            font-size: 28px;
            font-weight: 700;
            color: var(--blanco);
        }

        .overlay-fin .botones-fin {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .overlay-fin .btn-fin {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            border: none;
            transition: var(--transicion);
        }

        .btn-revancha {
            background: var(--dorado);
            color: #1a2a10;
        }

        .btn-revancha:hover {
            background: var(--dorado-claro);
            box-shadow: 0 4px 20px rgba(200, 168, 78, 0.4);
        }

        .btn-inicio {
            background: transparent;
            color: var(--blanco);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-inicio:hover {
            border-color: var(--blanco);
        }

        /* Mensaje flotante */
        .mensaje-flotante {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            color: var(--dorado);
            padding: 16px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            z-index: 150;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .mensaje-flotante.mostrar {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Responsive - desktop: botones a los lados de la mesa */
        @media (max-width: 767px) {
            .zona-botones {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: clamp(3px, 0.8vmin, 6px);
                padding: clamp(2px, 0.4vh, 5px) 2px;
            }

            .botones-laterales {
                display: contents;
            }

            .btn-accion {
                min-width: 0;
                width: 100%;
                font-size: clamp(9px, 2.4vmin, 12px);
                padding: clamp(5px, 1.4vmin, 9px) clamp(3px, 1vmin, 6px);
            }

            /* Colocar Jugar debajo de VAR (intercambio con Golazo) */
            #btnJugarCarta {
                grid-column: 4;
                grid-row: 2;
            }

            #btnGolazo {
                grid-column: 5;
                grid-row: 1;
            }
        }

        @media (min-width: 768px) {
            .juego {
                grid-template-rows: auto minmax(0, 1fr) auto auto;
                grid-template-columns: minmax(100px, 13vw) 1fr minmax(100px, 13vw);
                grid-template-areas:
                    "cpu cpu cpu"
                    "botones-izq mesa botones-der"
                    "jugador jugador jugador"
                    "marcador marcador marcador";
                gap: clamp(6px, 1.2vh, 14px);
                padding: clamp(8px, 1.5vh, 14px) clamp(10px, 2vw, 18px);
                max-width: 1400px;
                margin: 0 auto;
            }

            .zona-botones {
                display: contents;
            }

            .botones-laterales.izquierda {
                grid-area: botones-izq;
                flex-direction: column;
                align-items: stretch;
                justify-content: center;
            }

            .botones-laterales.derecha {
                grid-area: botones-der;
                flex-direction: column;
                align-items: stretch;
                justify-content: center;
            }

            .btn-accion {
                min-width: clamp(90px, 11vw, 130px);
                width: 100%;
            }

            /* Ocultar el botón Jugar en PC (escritorio) */
            #btnJugarCarta {
                display: none;
            }
        }

        @media (min-width: 1024px) {
            .juego {
                grid-template-columns: minmax(120px, 14vw) 1fr minmax(120px, 14vw);
                max-width: 1500px;
            }
        }
    </style>
</head>

                </span>

                <div>⚽</div>
                <div class="minuto" id="minutoActual">0'</div>

                <span class="nombre">CPU</span>
                <span class="goles-numero" id="golesCpu">0</span>
